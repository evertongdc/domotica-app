  // ───────────────────────── editor ─────────────────────────
  function abrirEditor(c, id) {
    ED = { id: id, plano: null, marcas: [], produtos: [], url: '', W: 1600, H: 1200, view: { s: 1, tx: 0, ty: 0 }, ferramenta: 'mover', cat: 'interruptor_1', rascunho: [], sel: null, movendo: null, filtro: 'pendentes', aba: 'planta' };
    $id('topbar-actions').innerHTML = '<button class="btn btn-secondary" data-acao="voltar">← Plantas</button> <button class="btn btn-ghost" data-acao="excluir-planta">Excluir</button>';
    c.innerHTML = '<div class="glass card" style="padding:12px 14px;margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline"><div class="row-title" id="pl-titulo">Carregando...</div><div class="small" id="pl-prog"></div></div><div class="pl-barra" style="margin-top:8px"><i id="pl-barra" style="width:0%"></i></div></div>' +
      '<div class="pl-abas"><button class="pl-btn ativo" data-aba="planta">Planta</button><button class="pl-btn" data-aba="lista" id="pl-aba-lista">Execução</button></div>' +
      '<div class="pl-corpo" id="pl-corpo" data-aba="planta">' +
        '<div class="pl-col-planta"><div class="pl-tools" id="pl-tools"></div><div class="pl-paleta" id="pl-paleta"></div><div class="pl-palco" id="pl-palco"></div>' +
        '<div class="small" id="pl-dica" style="margin-top:6px"></div></div>' +
        '<div class="pl-lado glass card" style="padding:12px 14px" id="pl-lado"></div></div>';
    const acao = function(e) {
      const el = e.target.closest('[data-acao],[data-aba],[data-cat],[data-ferr],[data-toggle],[data-ir]'); if (!el) return;
      if (el.hasAttribute('data-aba')) { ED.aba = el.getAttribute('data-aba'); $id('pl-corpo').setAttribute('data-aba', ED.aba); document.querySelectorAll('.pl-abas .pl-btn').forEach(function(b) { b.classList.toggle('ativo', b.getAttribute('data-aba') === ED.aba); }); if (ED.aba === 'planta') setTimeout(ajustar, 30); return; }
      if (el.hasAttribute('data-cat')) { ED.cat = el.getAttribute('data-cat'); ED.ferramenta = 'ponto'; ED.rascunho = []; pintaBarra(); desenhar(); return; }
      if (el.hasAttribute('data-ferr')) { trocarFerramenta(el.getAttribute('data-ferr')); return; }
      if (el.hasAttribute('data-toggle')) { e.stopPropagation(); alternar(el.getAttribute('data-toggle')); return; }
      if (el.hasAttribute('data-ir')) { irPara(el.getAttribute('data-ir')); return; }
      const a = el.getAttribute('data-acao');
      if (a === 'voltar') { ED = null; navegar('plantas'); }
      else if (a === 'excluir-planta') confirmarAcao('Excluir esta planta e todas as marcações? Não dá para desfazer.', excluirPlanta, { textoConfirmar: 'Excluir', perigo: true });
      else if (a === 'zoom-mais') zoomCentro(1.3); else if (a === 'zoom-menos') zoomCentro(1 / 1.3); else if (a === 'ajustar') ajustar();
      else if (a === 'concluir-linha') concluirLinha(); else if (a === 'cancelar-linha') { ED.rascunho = []; pintaBarra(); desenhar(); }
      else if (a === 'filtro') { ED.filtro = el.getAttribute('data-valor'); pintaLado(); }
    };
    c.addEventListener('click', acao); $id('topbar-actions').addEventListener('click', acao);
    chamarBackend('obterPlanta', [APP.token, id], function(r) {
      ED.plano = r.plano; ED.marcas = r.marcas; ED.produtos = r.produtos; ED.url = r.url; ED.W = r.plano.largura; ED.H = r.plano.altura; ED.cliente = r.cliente;
      $id('pl-titulo').textContent = r.plano.nome + (r.cliente ? ' · ' + r.cliente : '');
      pintaBarra(); montarPalco(); pintaLado();
    }, function(err) { toast(err, 'error', 8000); navegar('plantas'); });
  }

  function trocarFerramenta(f) { ED.ferramenta = f; ED.rascunho = []; ED.movendo = null; pintaBarra(); desenhar(); }

  function pintaBarra() {
    const t = $id('pl-tools'), p = $id('pl-paleta'); if (!t) return;
    const fb = function(id, txt) { return '<button class="pl-btn' + (ED.ferramenta === id ? ' ativo' : '') + '" data-ferr="' + id + '">' + txt + '</button>'; };
    t.innerHTML = fb('mover', '✋ Mover') + fb('linha', '✎ Fio / linha') + fb('texto', 'T Anotação') +
      '<button class="pl-btn" data-acao="zoom-menos">−</button><button class="pl-btn" data-acao="zoom-mais">+</button><button class="pl-btn" data-acao="ajustar">Ajustar</button>' +
      (ED.ferramenta === 'linha' && ED.rascunho.length ? '<button class="pl-btn ativo" data-acao="concluir-linha">✔ Concluir linha (' + ED.rascunho.length + ' pts)</button><button class="pl-btn" data-acao="cancelar-linha">Cancelar</button>' : '');
    p.innerHTML = CATEGORIAS.map(function(c) { return '<button class="pl-chip' + (ED.ferramenta === 'ponto' && ED.cat === c.id ? ' ativo' : '') + '" data-cat="' + c.id + '"><b>' + c.sigla + '</b>' + escHtml(c.nome.replace(/ \(.*\)/, '')) + '</button>'; }).join('');

      ED.ferramenta === 'linha' ? 'Toque nos pontos do caminho do fio/eletroduto e depois em “Concluir linha”.' : ED.ferramenta === 'texto' ? 'Toque onde quer a anotação.' : 'Arraste para mover a planta, use dois dedos (ou a roda do mouse) para ampliar. Escolha um tipo acima para marcar pontos.';
  }

  // ── palco (SVG com zoom e arraste) ──
  function montarPalco() {
    const palco = $id('pl-palco'); if (!palco) return;
    const NS = 'http://www.w3.org/2000/svg';
    palco.innerHTML = '<svg id="pl-svg" width="100%" height="100%" style="display:block;touch-action:none;user-select:none"><defs><pattern id="pl-grade" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#dbe3f0" stroke-width="1"/></pattern></defs>' +
      '<g id="pl-g"><rect width="' + ED.W + '" height="' + ED.H + '" fill="#fff"/>' + (ED.url ? '<image id="pl-img" href="' + escHtml(ED.url) + '" width="' + ED.W + '" height="' + ED.H + '" preserveAspectRatio="none"/>' : '<rect width="' + ED.W + '" height="' + ED.H + '" fill="url(#pl-grade)"/>') +
      '<g id="pl-linhas"></g><g id="pl-pontos"></g><g id="pl-rasc"></g></g></svg>';
    const svg = $id('pl-svg'), ptrs = {};
    let gesto = null;
    const dist = function(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); };
    svg.addEventListener('pointerdown', function(e) {
      try { svg.setPointerCapture(e.pointerId); } catch (x) { /* toque sintético */ }
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: Date.now(), alvo: e.target.closest('[data-m]'), moveu: false, multi: false };
      const ids = Object.keys(ptrs);
      if (ids.length === 2) { ids.forEach(function(k) { ptrs[k].multi = true; }); gesto = { d0: dist(ptrs[ids[0]], ptrs[ids[1]]), s0: ED.view.s }; }
    });
    svg.addEventListener('pointermove', function(e) {
      const p = ptrs[e.pointerId]; if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
      const ids = Object.keys(ptrs);
      if (ids.length === 1) {
        if (Math.hypot(p.x - p.x0, p.y - p.y0) > 7) p.moveu = true;
        if (p.moveu) { ED.autoFit = false; ED.view.tx += dx; ED.view.ty += dy; aplicar(); }
      } else if (ids.length === 2 && gesto) {
        const a = ptrs[ids[0]], b = ptrs[ids[1]], r = svg.getBoundingClientRect(), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
        const alvo = Math.min(14, Math.max(0.05, gesto.s0 * dist(a, b) / (gesto.d0 || 1)));
        zoomEm(mx, my, alvo / ED.view.s); ED.view.tx += dx / 2; ED.view.ty += dy / 2; aplicar();
      }
    });
    const fim = function(e) {
      const p = ptrs[e.pointerId]; delete ptrs[e.pointerId];
      if (Object.keys(ptrs).length < 2) gesto = null;
      if (p && !p.moveu && !p.multi && Date.now() - p.t < 600) toque(e, p);
    };
    svg.addEventListener('pointerup', fim); svg.addEventListener('pointercancel', function(e) { delete ptrs[e.pointerId]; gesto = null; });
    svg.addEventListener('wheel', function(e) { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomEm(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.18 : 1 / 1.18); aplicar(); }, { passive: false });
    ED.autoFit = true;
    if (window.ResizeObserver) new ResizeObserver(function() { if (ED && ED.autoFit && $id('pl-svg')) ajustar(); }).observe(palco);
    ajustar();
  }

  function ajustar() {
    const svg = $id('pl-svg'); if (!svg) return;
    const r = svg.getBoundingClientRect(); if (!r.width) return;
    const s = Math.min(r.width / ED.W, r.height / ED.H);
    ED.view = { s: s, tx: (r.width - ED.W * s) / 2, ty: (r.height - ED.H * s) / 2 };
    ED.sMin = s * 0.5; ED.autoFit = true; aplicar();
  }
  function zoomEm(cx, cy, f) {
    ED.autoFit = false;
    const v = ED.view, ns = Math.min(14, Math.max(ED.sMin || 0.05, v.s * f)); f = ns / v.s;
    v.tx = cx - (cx - v.tx) * f; v.ty = cy - (cy - v.ty) * f; v.s = ns;
  }
  function zoomCentro(f) { const r = $id('pl-svg').getBoundingClientRect(); zoomEm(r.width / 2, r.height / 2, f); aplicar(); }
  let agendado = false;
  function aplicar() {
    const g = $id('pl-g'); if (!g) return;
    g.setAttribute('transform', 'translate(' + ED.view.tx + ',' + ED.view.ty + ') scale(' + ED.view.s + ')');
    if (!agendado) { agendado = true; requestAnimationFrame(function() { agendado = false; desenhar(); }); }
  }
  function coord(e) { const r = $id('pl-svg').getBoundingClientRect(); return { x: (e.clientX - r.left - ED.view.tx) / ED.view.s, y: (e.clientY - r.top - ED.view.ty) / ED.view.s }; }
  function dentro(p) { return p.x >= 0 && p.y >= 0 && p.x <= ED.W && p.y <= ED.H; }

  function toque(e, p) {
    if (ED.movendo) {
      const q = coord(e); if (!dentro(q)) return; const id = ED.movendo; ED.movendo = null;
      gravar({ id: id, x: q.x / ED.W, y: q.y / ED.H }, function() { toast('Marcação movida.', 'success', 1500); }); pintaBarra(); return;
    }
    if (p.alvo && ED.ferramenta !== 'linha') { editarMarca(p.alvo.getAttribute('data-m')); return; }
    const q = coord(e); if (!dentro(q)) return;
    if (ED.ferramenta === 'ponto') {
      gravar({ tipo: 'ponto', categoria: ED.cat, x: q.x / ED.W, y: q.y / ED.H, status: 'pendente' }, function() { toast(cat(ED.cat).nome + ' adicionado.', 'success', 1200); });
    } else if (ED.ferramenta === 'linha') { ED.rascunho.push([q.x / ED.W, q.y / ED.H]); pintaBarra(); desenhar(); }
    else if (ED.ferramenta === 'texto') {
      const t = window.prompt('Texto da anotação:'); if (!t || !t.trim()) return;
      gravar({ tipo: 'texto', categoria: 'outro', rotulo: t.trim().slice(0, 120), x: q.x / ED.W, y: q.y / ED.H, status: 'pendente' });
    }
  }

  function concluirLinha() {
    if (ED.rascunho.length < 2) { toast('Marque pelo menos 2 pontos.', 'warn'); return; }
    const pts = ED.rascunho.slice(); ED.rascunho = [];
    gravar({ tipo: 'linha', categoria: 'infra', x: pts[0][0], y: pts[0][1], pontos: pts, status: 'pendente' }, function() { toast('Linha adicionada.', 'success', 1200); });
    pintaBarra();
  }

  // ── gravar / alternar ──
  function gravar(m, depois) {
    chamarBackend('salvarMarca', [APP.token, Object.assign({ plan_id: ED.id }, m)], function(r) {
      const i = ED.marcas.findIndex(function(x) { return x.id === r.id; });
      if (i > -1) ED.marcas[i] = r; else ED.marcas.push(r);
      desenhar(); pintaLado(); pintaBarra(); if (depois) depois(r);
    });
  }
  function alternar(id) {
    const m = ED.marcas.filter(function(x) { return x.id === id; })[0]; if (!m) return;
    gravar({ id: id, status: m.status === 'executado' ? 'pendente' : 'executado' });
  }
  function irPara(id) {
    const m = ED.marcas.filter(function(x) { return x.id === id; })[0]; if (!m) return;
    ED.aba = 'planta'; $id('pl-corpo').setAttribute('data-aba', 'planta'); document.querySelectorAll('.pl-abas .pl-btn').forEach(function(b) { b.classList.toggle('ativo', b.getAttribute('data-aba') === 'planta'); });
    setTimeout(function() {
      const r = $id('pl-svg').getBoundingClientRect(); ED.view.s = Math.max(ED.view.s, Math.min(r.width / ED.W, r.height / ED.H) * 2.2);
      ED.view.tx = r.width / 2 - m.x * ED.W * ED.view.s; ED.view.ty = r.height / 2 - m.y * ED.H * ED.view.s; ED.sel = id; aplicar();
    }, 40);
  }

  function editarMarca(id) {
    const m = ED.marcas.filter(function(x) { return x.id === id; })[0]; if (!m) return;
    ED.sel = id; desenhar();
    const feito = m.status === 'executado', ambientes = Array.from(new Set(ED.marcas.map(function(x) { return x.ambiente; }).filter(Boolean)));
    abrirModal((m.tipo === 'linha' ? 'Fio / linha' : m.tipo === 'texto' ? 'Anotação' : cat(m.categoria).nome),
      '<button class="btn ' + (feito ? 'btn-secondary' : 'btn-primary') + ' btn-full" id="pm-exec" style="font-size:16px;padding:14px;margin-bottom:12px">' + (feito ? '↩ Voltar para pendente' : '✔ Marcar como executado') + '</button>' +
      (feito && m.executado_em ? '<div class="small" style="margin:-4px 0 10px">Executado em ' + escHtml(new Date(m.executado_em).toLocaleString('pt-BR')) + '</div>' : '') +
      '<div class="form-grid">' +
        (m.tipo === 'ponto' ? '<div class="form-group"><label class="form-label">Tipo</label><select id="pm-cat" class="form-input">' + CATEGORIAS.map(function(c) { return '<option value="' + c.id + '"' + (c.id === m.categoria ? ' selected' : '') + '>' + escHtml(c.nome) + '</option>'; }).join('') + '</select></div>' : '') +
        '<div class="form-group"><label class="form-label">' + (m.tipo === 'texto' ? 'Texto' : 'Nome / identificação') + '</label><input id="pm-rotulo" class="form-input" placeholder="Ex.: Luz da sala" value="' + escHtml(m.rotulo || '') + '"></div>' +
        '<div class="form-group"><label class="form-label">Ambiente</label><input id="pm-amb" class="form-input" list="pm-amb-lista" placeholder="Ex.: Sala" value="' + escHtml(m.ambiente || '') + '"><datalist id="pm-amb-lista">' + ambientes.map(function(a) { return '<option value="' + escHtml(a) + '">'; }).join('') + '</datalist></div>' +

  // ── desenho das marcações ──
  function desenhar() {
    const gl = $id('pl-linhas'), gp = $id('pl-pontos'), gr = $id('pl-rasc'); if (!gl || !ED) return;
    const s = ED.view.s, W = ED.W, H = ED.H, R = 15 / s;
    let L = '', P = '';
    ED.marcas.forEach(function(m) {
      const feito = m.status === 'executado', cor = feito ? COR_FEITO : COR_PEND, sel = ED.sel === m.id || ED.movendo === m.id;
      if (m.tipo === 'linha' && Array.isArray(m.pontos)) {
        const pts = m.pontos.map(function(p) { return (p[0] * W) + ',' + (p[1] * H); }).join(' ');
        L += '<g data-m="' + m.id + '" style="cursor:pointer"><polyline points="' + pts + '" fill="none" stroke="transparent" stroke-width="' + (22 / s) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<polyline points="' + pts + '" fill="none" stroke="' + (sel ? COR_SEL : cor) + '" stroke-width="' + ((sel ? 6 : 4) / s) + '" stroke-linecap="round" stroke-linejoin="round"' + (feito ? '' : ' stroke-dasharray="' + (10 / s) + ' ' + (7 / s) + '"') + '/></g>';
      } else if (m.tipo === 'texto') {
        const fs = 14 / s, w = Math.max(30 / s, (m.rotulo || '').length * fs * 0.58 + 12 / s);
        P += '<g data-m="' + m.id + '" transform="translate(' + (m.x * W) + ',' + (m.y * H) + ')" style="cursor:pointer"><rect x="' + (-w / 2) + '" y="' + (-fs) + '" width="' + w + '" height="' + (fs * 1.7) + '" rx="' + (4 / s) + '" fill="#fff" fill-opacity=".92" stroke="' + (sel ? COR_SEL : '#64748b') + '" stroke-width="' + (1.5 / s) + '"/><text text-anchor="middle" y="' + (fs * 0.2) + '" font-size="' + fs + '" fill="#0f172a" font-family="Inter,sans-serif">' + escHtml(m.rotulo || '') + '</text></g>';
      } else {
        const c = cat(m.categoria), rotulo = s > 0.5 && m.rotulo ? '<text y="' + (R + 14 / s) + '" text-anchor="middle" font-size="' + (12 / s) + '" fill="#0f172a" stroke="#fff" stroke-width="' + (3 / s) + '" paint-order="stroke" font-family="Inter,sans-serif">' + escHtml(m.rotulo.slice(0, 22)) + '</text>' : '';
        P += '<g data-m="' + m.id + '" transform="translate(' + (m.x * W) + ',' + (m.y * H) + ')" style="cursor:pointer">' + (sel ? '<circle r="' + (R + 6 / s) + '" fill="none" stroke="' + COR_SEL + '" stroke-width="' + (3 / s) + '"/>' : '') +
          '<circle r="' + R + '" fill="' + cor + '" stroke="#fff" stroke-width="' + (2.5 / s) + '"/><text y="' + (5 / s) + '" text-anchor="middle" font-size="' + (15 / s) + '" font-weight="700" fill="#fff" font-family="Inter,sans-serif">' + (feito ? '✓' : c.sigla) + '</text>' + rotulo + '</g>';
      }
    });
    gl.innerHTML = L; gp.innerHTML = P;
    gr.innerHTML = ED.rascunho.length ? '<polyline points="' + ED.rascunho.map(function(p) { return (p[0] * W) + ',' + (p[1] * H); }).join(' ') + '" fill="none" stroke="' + COR_SEL + '" stroke-width="' + (4 / s) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      ED.rascunho.map(function(p) { return '<circle cx="' + (p[0] * W) + '" cy="' + (p[1] * H) + '" r="' + (6 / s) + '" fill="' + COR_SEL + '"/>'; }).join('') : '';
  }

  // ── painel de execução (lista) ──
  function pintaLado() {
    const box = $id('pl-lado'); if (!box || !ED) return;
    const pontos = ED.marcas.filter(function(m) { return m.tipo !== 'texto'; });
    const feitos = pontos.filter(function(m) { return m.status === 'executado'; }).length, total = pontos.length, pct = total ? Math.round(100 * feitos / total) : 0;
    const pr = $id('pl-prog'); if (pr) pr.textContent = feitos + ' de ' + total + ' executados (' + pct + '%)';
    const br = $id('pl-barra'); if (br) br.style.width = pct + '%';
    const al = $id('pl-aba-lista'); if (al) al.textContent = 'Execução (' + (total - feitos) + ' faltam)';
    const lista = pontos.filter(function(m) { return ED.filtro === 'todos' || (ED.filtro === 'pendentes' ? m.status !== 'executado' : m.status === 'executado'); });
    const grupos = {};
    lista.forEach(function(m) { const a = m.ambiente || 'Sem ambiente'; (grupos[a] = grupos[a] || []).push(m); });
    const fb = function(v, t) { return '<button class="pl-btn' + (ED.filtro === v ? ' ativo' : '') + '" data-acao="filtro" data-valor="' + v + '">' + t + '</button>'; };
    box.innerHTML = '<div class="row-title" style="margin-bottom:8px">Execução</div><div class="pl-tools" style="padding-bottom:4px">' + fb('pendentes', 'Faltam (' + (total - feitos) + ')') + fb('executados', 'Feitos (' + feitos + ')') + fb('todos', 'Todos') + '</div>' +
      (lista.length ? Object.keys(grupos).sort().map(function(a) {
        return '<div class="pl-grupo">' + escHtml(a) + '</div>' + grupos[a].map(function(m) {
          const feito = m.status === 'executado', c = m.tipo === 'linha' ? { sigla: '━', nome: 'Fio / linha' } : cat(m.categoria);
          return '<div class="pl-item" data-ir="' + m.id + '"><input type="checkbox" data-toggle="' + m.id + '"' + (feito ? ' checked' : '') + '><span class="pl-sigla" style="background:' + (feito ? COR_FEITO : COR_PEND) + '">' + c.sigla + '</span>' +
            '<div style="min-width:0"><div class="row-title" style="' + (feito ? 'text-decoration:line-through;opacity:.6' : '') + '">' + escHtml(m.rotulo || c.nome) + '</div><div class="small">' + escHtml(m.rotulo ? c.nome : '') + '</div></div></div>';
        }).join('');
      }).join('') : '<div class="small" style="padding:14px 0">' + (total ? (ED.filtro === 'pendentes' ? 'Tudo executado. 🎉' : 'Nada por aqui.') : 'Nenhuma marcação ainda. Escolha um tipo e toque na planta.') + '</div>');
  }
})();

<script>// Chaves PÚBLICAS do projeto Supabase "domotica-erp" (a chave publishable foi feita para ficar no navegador;

window.DOMOTICA_CFG = {

<script>// Adaptador: faz as telas do ERP (feitas para o Apps Script) conversarem com o Supabase.
// Substitui google.script.run por chamadas ao banco (com RLS) e troca o login pelo Supabase Auth.
(function() {
  const CFG = window.DOMOTICA_CFG;
  const sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  window.SB = sb;
  let CTX = null;

  const ok = function(d) { return { success: true, data: d }; };
  async function api(fn) {
    try { return ok(await fn()); }
    catch (e) {
      const m = (e && e.message) || String(e);
      if (m === 'SESSAO_INVALIDA') return { success: false, error: 'SESSAO_INVALIDA', code: 401 };
      return { success: false, error: m, code: 500 };
    }
  }
  function must(r) { if (r.error) throw new Error(r.error.message); return r.data; }

  async function ctx() {
    if (CTX) return CTX;
    const s = (await sb.auth.getSession()).data.session;
    if (!s) throw new Error('SESSAO_INVALIDA');
    const m = must(await sb.from('memberships').select('org_id, role, organizations(nome, afiliado_ml_id, lista_ml_url, garantia_limite_pequeno, garantia_pct_minimo, garantia_meses_pequeno, garantia_meses_grande, garantia_meses_baixo)').eq('user_id', s.user.id).limit(1));
    if (!m.length) throw new Error('Sua conta ainda não está vinculada a uma empresa. Peça um convite ao administrador.');
    CTX = { user: s.user, orgId: m[0].org_id, role: m[0].role, org: m[0].organizations, nome: (s.user.user_metadata && (s.user.user_metadata.nome || s.user.user_metadata.full_name)) || s.user.email };
    return CTX;
  }

  // ---- mapeamento entre colunas do banco (minúsculas) e os nomes usados pelas telas (MAIÚSCULAS) ----
  const CLI = ['NOME', 'TIPO', 'TELEFONE', 'WHATSAPP', 'EMAIL', 'ENDERECO', 'BAIRRO', 'CIDADE', 'ESTADO', 'CEP', 'OBSERVACOES', 'STATUS'];
  const PROD = ['NOME', 'CATEGORIA', 'MARCA', 'APP_CONTROLE', 'FORMATO_CAIXA', 'EXIGE_NEUTRO', 'ALEXA', 'ORIGEM', 'LINK_COMISSAO', 'PRECO_APARELHO', 'PRECO_INSTALACAO', 'CUSTO', 'IMAGEM_URL', 'BENEFICIO_1', 'BENEFICIO_2', 'BENEFICIO_3', 'ATIVO', 'PRECO_ANTERIOR', 'PRECO_ATUALIZADO_EM', 'FORA_DA_LISTA'];
  const NUM = { PRECO_APARELHO: 1, PRECO_INSTALACAO: 1, CUSTO: 1 }, BOOL = { EXIGE_NEUTRO: 1, ALEXA: 1, ATIVO: 1 };
  function de(row, campos, idCol) {
    const o = {}; o[idCol] = row.id;
    campos.forEach(function(c) { let v = row[c.toLowerCase()]; if (v === null || v === undefined) v = ''; if (c === 'PRECO_ATUALIZADO_EM' && v) v = String(v).slice(0, 10); o[c] = v; });
    return o;
  }
  function para(d, campos) {
    const o = {};
    campos.forEach(function(c) {
      if (d[c] === undefined) return;
      let v = d[c];
      if (BOOL[c]) v = v === true || v === 'true' || v === 'TRUE' || v === 1 || v === '1';
      else if (NUM[c]) { v = (v === '' || v === null) ? null : Number(String(v).replace(',', '.')); if (v !== null && isNaN(v)) v = null; }
      else if (typeof v === 'string') { v = v.trim(); if (v === '' && ['TIPO', 'STATUS', 'ORIGEM'].indexOf(c) === -1) v = null; }
      o[c.toLowerCase()] = v;
    });
    return o;
  }
  const chaveLink = function(u) { return String(u || '').trim().toLowerCase().replace(/[?#].*$/, '').replace(/\/+$/, ''); };
  const chaveNome = function(n) { return String(n || '').toLowerCase().replace(/\s+/g, ' ').trim(); };
  const ehMl = function(u) { return /mercadolivre\.com\.br|meli\.la/i.test(String(u || '')); };

  async function listaCatalogo() { const c = await ctx(); return must(await sb.from('catalog_products').select('*').eq('org_id', c.orgId).order('nome')); }
  async function listaClientes() { const c = await ctx(); return must(await sb.from('clients').select('*').eq('org_id', c.orgId).order('nome')); }

  async function funcao(corpo) {
    const c = await ctx();
    const r = await sb.functions.invoke('precos-ml', { body: Object.assign({ org_id: c.orgId }, corpo) });
    if (r.error) throw new Error('Não consegui falar com o servidor de preços: ' + r.error.message);
    if (!r.data || r.data.ok === false) throw new Error((r.data && r.data.erro) || 'Erro no servidor de preços.');
    return r.data;
  }

  async function prepararImagem(file) {
    let bmp;
    try { bmp = await createImageBitmap(file); } catch (e) { throw new Error('Não consegui ler essa imagem. Use JPG, PNG ou WEBP.'); }
    const esc = Math.min(1, 2400 / Math.max(bmp.width, bmp.height)), w = Math.round(bmp.width * esc), h = Math.round(bmp.height * esc);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
    const blob = await new Promise(function(r) { cv.toBlob(r, 'image/jpeg', 0.88); });
    if (!blob) throw new Error('Não consegui preparar a imagem.');
    return { blob: blob, w: w, h: h };
  }

  // ---- garantia (mesma regra do Apps Script, com os prazos da empresa) ----
  function calcularGarantia(itens, ref, org) {
    const dia = 86400000, hoje = ref ? new Date(ref) : new Date();
    let total = 0, daEmpresa = 0;
    const detalhes = (itens || []).map(function(it) {
      const qtd = Math.max(1, Math.round(Number(it.qtd) || 1)), origem = String(it.origem || '').toLowerCase();
      let conta = false, motivo;
      if (it.reinstalacao) {
        const dt = it.dataInstalacaoAnterior ? new Date(it.dataInstalacaoAnterior) : null, dias = dt && !isNaN(dt) ? Math.floor((hoje - dt) / dia) : null;
        if (!it.retiradaPelaDomotica) motivo = 'reinstalação sem retirada feita pela Domótica';
        else if (dias === null) motivo = 'reinstalação sem data da instalação anterior';
        else if (dias >= 365) motivo = 'reinstalação com mais de 1 ano';
        else { conta = true; motivo = 'reinstalação com menos de 1 ano'; }
      } else if (origem === 'domotica') { conta = true; motivo = 'fornecido pela Domótica'; }
      else if (origem === 'indicado') { conta = true; motivo = 'indicado pela Domótica'; }
      else motivo = 'comprado pelo cliente ou já existente';
      total += qtd; if (conta) daEmpresa += qtd;
      return { qtd: qtd, conta: conta, motivo: motivo };
    });
    const pct = total ? daEmpresa / total : 0, grande = total >= org.garantia_limite_pequeno, estendida = total > 0 && pct * 100 >= org.garantia_pct_minimo - 1e-9;
    const meses = total === 0 ? 0 : (estendida ? (grande ? org.garantia_meses_grande : org.garantia_meses_pequeno) : org.garantia_meses_baixo);
    return { total: total, daDomotica: daEmpresa, pct: Math.round(pct * 1000) / 10, grande: grande, estendida: estendida, meses: meses, detalhes: detalhes };
  }

  // ---- planilha estilizada (.xlsx) só com os links ----
  function carregaScript(src) {
    return new Promise(function(res, rej) { if (window.ExcelJS) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function() { rej(new Error('Não consegui carregar o gerador de planilha.')); }; document.head.appendChild(s); });
  }
  async function gerarXlsx(prods, vincs, clientes) {
    await carregaScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
    const LARANJA = 'FFFE792C', AZUL = 'FF0D44DE', CLARO = 'FFEEF3FF', BRANCO = 'FFFFFFFF';
    const wb = new ExcelJS.Workbook(); wb.creator = 'Domótica';
    const quando = new Date().toLocaleString('pt-BR');
    const montar = function(ws, titulo, sub, cab, larg) {
      ws.columns = larg.map(function(w) { return { width: w }; });
      ws.mergeCells(1, 1, 1, cab.length); ws.getCell('A1').value = titulo; ws.getCell('A1').font = { name: 'Calibri', size: 18, bold: true, color: { argb: LARANJA } };
      ws.mergeCells(2, 1, 2, cab.length); ws.getCell('A2').value = sub; ws.getCell('A2').font = { size: 10, color: { argb: 'FF6B7280' } };
      ws.getRow(1).height = 32;
      const h = ws.getRow(3); h.height = 26;
      cab.forEach(function(t, i) { const c = h.getCell(i + 1); c.value = t; c.font = { bold: true, color: { argb: BRANCO } }; c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: AZUL } }; c.alignment = { vertical: 'middle' }; });
      ws.views = [{ state: 'frozen', ySplit: 3, showGridLines: false }];
    };
    const linha = function(ws, valores, i, linkCol, nomeCol, lojaCol) {
      const r = ws.addRow(valores); r.height = 22;
      r.eachCell(function(c) { c.alignment = { vertical: 'middle' }; if (i % 2) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: CLARO } }; c.border = { bottom: { style: 'thin', color: { argb: 'FFDDE5F7' } } }; });
      const l = r.getCell(linkCol); l.value = { text: valores[linkCol - 1], hyperlink: valores[linkCol - 1] }; l.font = { color: { argb: AZUL }, underline: true };
      r.getCell(nomeCol).font = { bold: true }; r.getCell(lojaCol).font = { bold: true, color: { argb: LARANJA } };
      return r;
    };
    const ws = wb.addWorksheet('Produtos');
    montar(ws, 'Links de produtos — Domótica', 'Atualizado em ' + quando + ' · ' + prods.length + ' produto(s)', ['Produto', 'Marca', 'Categoria', 'Site', 'Preço', 'Link'], [52, 16, 20, 16, 14, 80]);
    prods.forEach(function(p, i) { const r = linha(ws, [p.NOME, p.MARCA || '', p.CATEGORIA || '', nomeLoja(p.LINK_COMISSAO), p.PRECO_APARELHO === '' ? null : Number(p.PRECO_APARELHO), p.LINK_COMISSAO], i, 6, 1, 4); r.getCell(5).numFmt = 'R$ #,##0.00'; });
    const wc = wb.addWorksheet('Por cliente');
    montar(wc, 'Links por cliente', 'Atualizado em ' + quando + ' · ' + vincs.length + ' vínculo(s)', ['Cliente', 'WhatsApp', 'Produto', 'Site', 'Link'], [26, 18, 52, 16, 80]);
    vincs.forEach(function(v, i) { linha(wc, [v.cliente, v.whatsapp, v.produto, v.site, v.link], i, 5, 3, 4); });
    const buf = await wb.xlsx.writeBuffer();
    return URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }

  // ---- as funções que as telas chamam ----
  const API = {
    verificarStatusSistema: function() { return ok({ inicializado: true, precisaSetup: false }); },
    obterMeuUsuario: function() { return api(async function() { const c = await ctx(); return { id: c.user.id, nome: c.nome, usuario: c.user.email, email: c.user.email, role: c.role === 'owner' ? 'admin' : c.role }; }); },
    listarClientes: function() { return api(async function() { return (await listaClientes()).map(function(r) { return de(r, CLI, 'ID_CLIENTE'); }); }); },
    salvarCliente: function(t, d) {
      return api(async function() {
        const c = await ctx(); d = d || {};
        if (!String(d.NOME || '').trim()) throw new Error('Informe o nome do cliente.');
        if (d.TIPO && ['residencial', 'comercial'].indexOf(d.TIPO) === -1) throw new Error('Tipo inválido.');
        const row = para(d, CLI.filter(function(x) { return x !== 'STATUS'; }));
        const q = d.ID_CLIENTE ? sb.from('clients').update(row).eq('id', d.ID_CLIENTE) : sb.from('clients').insert(Object.assign({ org_id: c.orgId }, row));
        return de(must(await q.select().single()), CLI, 'ID_CLIENTE');
      });
    },
    arquivarCliente: function(t, id, arq) { return api(async function() { return de(must(await sb.from('clients').update({ status: arq ? 'arquivado' : 'ativo' }).eq('id', id).select().single()), CLI, 'ID_CLIENTE'); }); },
    listarCatalogo: function() { return api(async function() { return (await listaCatalogo()).map(function(r) { return de(r, PROD, 'ID_PRODUTO'); }); }); },
    salvarProduto: function(t, d) {
      return api(async function() {
        const c = await ctx(); d = d || {};
        if (!String(d.NOME || '').trim()) throw new Error('Informe o nome do produto.');
        const origem = d.ORIGEM || 'domotica';
        if (['domotica', 'indicado'].indexOf(origem) === -1) throw new Error('Origem inválida.');
        const row = para(Object.assign({}, d, { ORIGEM: origem }), PROD.filter(function(x) { return ['PRECO_ANTERIOR', 'PRECO_ATUALIZADO_EM', 'FORA_DA_LISTA'].indexOf(x) === -1; }));
        if (origem === 'domotica') row.link_comissao = null;
        const q = d.ID_PRODUTO ? sb.from('catalog_products').update(row).eq('id', d.ID_PRODUTO) : sb.from('catalog_products').insert(Object.assign({ org_id: c.orgId, ativo: true }, row));
        return de(must(await q.select().single()), PROD, 'ID_PRODUTO');
      });
    },
    alternarProdutoAtivo: function(t, id, ativo) { return api(async function() { return de(must(await sb.from('catalog_products').update({ ativo: !!ativo }).eq('id', id).select().single()), PROD, 'ID_PRODUTO'); }); },
    importarProdutos: function(t, itens) {
      return api(async function() {
        const c = await ctx();
        if (!Array.isArray(itens) || !itens.length) throw new Error('Nenhum produto para importar.');
        if (itens.length > 200) throw new Error('Importe no máximo 200 produtos por vez.');
        const ex = await listaCatalogo(), links = {}, nomes = {};
        ex.forEach(function(p) { if (ehMl(p.link_comissao)) links[chaveLink(p.link_comissao)] = 1; nomes[chaveNome(p.nome)] = 1; });
        const novos = [], ignorados = [];
        itens.forEach(function(it) {
          const nome = String(it.NOME || '').trim(); if (!nome) return;
          if (nomes[chaveNome(nome)] || (ehMl(it.LINK_COMISSAO) && links[chaveLink(it.LINK_COMISSAO)])) { ignorados.push(nome); return; }
          nomes[chaveNome(nome)] = 1; if (ehMl(it.LINK_COMISSAO)) links[chaveLink(it.LINK_COMISSAO)] = 1;
          novos.push(Object.assign({ org_id: c.orgId, origem: 'indicado', ativo: true }, para(Object.assign({}, it, { NOME: nome }), PROD.filter(function(x) { return ['ORIGEM', 'ATIVO', 'PRECO_ANTERIOR', 'PRECO_ATUALIZADO_EM', 'FORA_DA_LISTA'].indexOf(x) === -1; }))));
        });
        if (novos.length) must(await sb.from('catalog_products').insert(novos));
        return { criados: novos.length, ignorados: ignorados };
      });
    },
    listarVinculosClientes: function() { return api(async function() { const c = await ctx(); return must(await sb.from('client_products').select('client_id, product_id').eq('org_id', c.orgId)).map(function(v) { return { ID_CLIENTE: v.client_id, ID_PRODUTO: v.product_id }; }); }); },
    salvarProdutosDoCliente: function(t, idCliente, ids) {
      return api(async function() {
        const c = await ctx(); if (!Array.isArray(ids)) throw new Error('Lista de produtos inválida.');
        const desejados = ids.filter(function(x, i) { return ids.indexOf(x) === i; });
        const atuais = must(await sb.from('client_products').select('product_id').eq('client_id', idCliente)).map(function(v) { return v.product_id; });
        const remover = atuais.filter(function(p) { return desejados.indexOf(p) === -1; }), incluir = desejados.filter(function(p) { return atuais.indexOf(p) === -1; });
        if (remover.length) must(await sb.from('client_products').delete().eq('client_id', idCliente).in('product_id', remover));
        if (incluir.length) must(await sb.from('client_products').insert(incluir.map(function(p) { return { client_id: idCliente, product_id: p, org_id: c.orgId }; })));
        return { ID_CLIENTE: idCliente, ids: desejados };
      });
    },
    obterListaSalva: function() { return api(async function() { return (await ctx()).org.lista_ml_url || ''; }); },
    lerListaMercadoLivre: function(t, url) { return api(async function() { return await funcao({ acao: 'ler', url: url }); }); },
    atualizarPrecosAgora: function() { return api(async function() { return await funcao({ acao: 'atualizar' }); }); },
    gerarPlanilhaLinks: function() {
      return api(async function() {
        const c = await ctx();
        const prods = (await listaCatalogo()).filter(function(p) { return p.ativo && p.link_comissao; }).map(function(r) { return de(r, PROD, 'ID_PRODUTO'); });
        const porId = {}; prods.forEach(function(p) { porId[p.ID_PRODUTO] = p; });
        const cli = {}; (await listaClientes()).forEach(function(r) { cli[r.id] = r; });
        const vincs = must(await sb.from('client_products').select('client_id, product_id').eq('org_id', c.orgId)).filter(function(v) { return cli[v.client_id] && porId[v.product_id]; })
          .map(function(v) { const k = cli[v.client_id], p = porId[v.product_id]; return { cliente: k.nome, whatsapp: k.whatsapp || k.telefone || '', produto: p.NOME, site: nomeLoja(p.LINK_COMISSAO), link: p.LINK_COMISSAO }; })
          .sort(function(a, b) { return a.cliente.localeCompare(b.cliente, 'pt-BR') || a.produto.localeCompare(b.produto, 'pt-BR'); });
        const url = await gerarXlsx(prods, vincs, cli);
        return { url: url, arquivo: 'Links de Produtos - Domotica.xlsx', produtos: prods.length, vinculos: vincs.length };
      });
    },
    listarPlantas: function() {
      return api(async function() {
        const c = await ctx();
        const plans = must(await sb.from('plans').select('id, nome, created_at, clients(nome)').eq('org_id', c.orgId).order('created_at', { ascending: false }));
        const marks = must(await sb.from('plan_marks').select('plan_id, status').eq('org_id', c.orgId).neq('tipo', 'texto').range(0, 9999));
        const tot = {}, feitos = {};
        marks.forEach(function(m) { tot[m.plan_id] = (tot[m.plan_id] || 0) + 1; if (m.status === 'executado') feitos[m.plan_id] = (feitos[m.plan_id] || 0) + 1; });
        const clientes = (await listaClientes()).filter(function(x) { return x.status === 'ativo'; }).map(function(r) { return { ID_CLIENTE: r.id, NOME: r.nome }; });
        return { clientes: clientes, plantas: plans.map(function(p) { return { ID_PLANTA: p.id, NOME: p.nome, CLIENTE: p.clients ? p.clients.nome : '', TOTAL: tot[p.id] || 0, FEITOS: feitos[p.id] || 0 }; }) };
      });
    },
    criarPlanta: function(t, d) {
      return api(async function() {
        const c = await ctx(); d = d || {};
        if (!String(d.nome || '').trim()) throw new Error('Dê um nome ao projeto.');
        let img = null;
        if (d.arquivo) img = await prepararImagem(d.arquivo);
        const row = must(await sb.from('plans').insert({ org_id: c.orgId, client_id: d.clienteId || null, nome: String(d.nome).trim(), largura: img ? img.w : 1600, altura: img ? img.h : 1200 }).select().single());
        if (img) {
          const caminho = c.orgId + '/' + row.id + '/planta.jpg';
          const up = await sb.storage.from('plantas').upload(caminho, img.blob, { contentType: 'image/jpeg', upsert: true });
          if (up.error) { await sb.from('plans').delete().eq('id', row.id); throw new Error('Não consegui enviar a imagem: ' + up.error.message); }
          must(await sb.from('plans').update({ imagem_path: caminho }).eq('id', row.id));
        }
        return { ID_PLANTA: row.id };
      });
    },
    obterPlanta: function(t, id) {
      return api(async function() {
        const c = await ctx();
        const plano = must(await sb.from('plans').select('*, clients(nome)').eq('id', id).single());
        const marcas = must(await sb.from('plan_marks').select('*').eq('plan_id', id).order('created_at').range(0, 4999));
        const prods = must(await sb.from('catalog_products').select('id, nome').eq('org_id', c.orgId).eq('ativo', true).order('nome'));
        let url = '';
        if (plano.imagem_path) { const sg = await sb.storage.from('plantas').createSignedUrl(plano.imagem_path, 7200); if (sg.error) throw new Error('Não consegui abrir a imagem da planta: ' + sg.error.message); url = sg.data.signedUrl; }
        return { plano: plano, cliente: plano.clients ? plano.clients.nome : '', marcas: marcas, produtos: prods, url: url };
      });
    },
    salvarMarca: function(t, m) {
      return api(async function() {
        const c = await ctx(), row = {};
        ['tipo', 'categoria', 'rotulo', 'ambiente', 'x', 'y', 'pontos', 'product_id', 'observacoes', 'status'].forEach(function(k) { if (m[k] !== undefined) row[k] = m[k]; });
        ['rotulo', 'ambiente', 'observacoes'].forEach(function(k) { if (row[k] === '') row[k] = null; });
        if (row.status === 'executado') { row.executado_em = new Date().toISOString(); row.executado_por = c.user.id; }
        else if (row.status === 'pendente') { row.executado_em = null; row.executado_por = null; }
        const q = m.id ? sb.from('plan_marks').update(row).eq('id', m.id) : sb.from('plan_marks').insert(Object.assign({ org_id: c.orgId, plan_id: m.plan_id }, row));
        return must(await q.select().single());
      });
    },
    excluirMarca: function(t, id) { return api(async function() { must(await sb.from('plan_marks').delete().eq('id', id)); return { ok: true }; }); },
    excluirPlanta: function(t, id) {
      return api(async function() {
        const p = must(await sb.from('plans').select('imagem_path').eq('id', id).single());
        if (p.imagem_path) await sb.storage.from('plantas').remove([p.imagem_path]);
        must(await sb.from('plans').delete().eq('id', id));
        return { ok: true };
      });
    },
    listarCodigos: function() {
      return api(async function() {
        const c = await ctx();
        return must(await sb.from('activation_codes').select('recebido_em, remetente, assunto, codigo, links, clients(nome)').eq('org_id', c.orgId).order('recebido_em', { ascending: false }).limit(100))
          .map(function(r) { return { quando: new Date(r.recebido_em).toLocaleString('pt-BR'), cliente: r.clients ? r.clients.nome : '', remetente: r.remetente || '', assunto: r.assunto || '', codigo: r.codigo || '', links: r.links || [] }; });
      });
    },
    calcularGarantiaProjeto: function(t, itens, ref) { return api(async function() { return calcularGarantia(itens, ref, (await ctx()).org); }); },
    obterResumoInicio: function() {
      return api(async function() {
        const c = await ctx(), hoje = new Date(), d = function(x) { return x.toISOString().slice(0, 10); };
        const cnt = async function(q) { const r = await q; if (r.error) throw new Error(r.error.message); return r.count || 0; };
        const base = function(tab) { return sb.from(tab).select('id', { count: 'exact', head: true }).eq('org_id', c.orgId); };
        const [clientes, produtos, env, apr, vencendo, hojeV, semV] = await Promise.all([
          cnt(base('clients').eq('status', 'ativo')), cnt(base('catalog_products').eq('ativo', true)), cnt(base('quotes').eq('status', 'enviado')), cnt(base('quotes').eq('status', 'aprovado')),
          cnt(base('devices').gte('dt_fim_garantia', d(hoje)).lte('dt_fim_garantia', d(new Date(hoje.getTime() + 30 * 86400000)))),
          cnt(base('visits').neq('status', 'cancelada').gte('dt_inicio', d(hoje)).lt('dt_inicio', d(new Date(hoje.getTime() + 86400000)))),
          cnt(base('visits').neq('status', 'cancelada').gte('dt_inicio', d(hoje)).lte('dt_inicio', d(new Date(hoje.getTime() + 7 * 86400000)))),
        ]);
        return { clientesAtivos: clientes, produtosAtivos: produtos, orcamentos: { rascunho: 0, enviado: env, aprovado: apr, perdido: 0 }, garantiasVencendo: vencendo, visitasHoje: hojeV, visitasSemana: semV };
      });
    },
  };

  function mk(okF, failF) {
    return new Proxy({}, { get: function(_, fn) {
      if (fn === 'withSuccessHandler') return function(f) { return mk(f, failF); };
      if (fn === 'withFailureHandler') return function(g) { return mk(okF, g); };
      return function() {
        const a = [].slice.call(arguments);
        Promise.resolve().then(function() { if (!API[fn]) throw new Error('Função não existe: ' + fn); return API[fn].apply(null, a); }).then(okF).catch(function(e) { if (failF) failF(e); });
      };
    } });
  }
  window.google = { script: { run: mk(function() {}, function() {}) } };

  // ---- entrada: login com o Supabase Auth ----
  function msgErro(m) {
    m = String(m || '');
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
    if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link que enviamos e entre de novo.';
    if (/already registered|already been registered/i.test(m)) return 'Este e-mail já tem conta. Use “Entrar”.';
    if (/rate limit/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos.';
    if (/provider is not enabled|Unsupported provider/i.test(m)) return 'O login com Google ainda não foi ativado neste projeto.';
    return m;
  }
  const OLHO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const OLHO_CORTADO = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0112 19C5.6 19 2 12 2 12a18 18 0 015.1-5.9M9.9 5.1A9.7 9.7 0 0112 5c6.4 0 10 7 10 7a18 18 0 01-2.2 3.2M1 1l22 22"/><path d="M9.9 9.9a3 3 0 004.2 4.2"/></svg>';
  function olho(el) {
    if (!el || el.getAttribute('data-olho')) return;
    el.setAttribute('data-olho', '1');
    const w = document.createElement('div'); w.style.position = 'relative'; el.parentNode.insertBefore(w, el); w.appendChild(el); el.style.paddingRight = '46px';
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Mostrar senha');
    b.style.cssText = 'position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:inherit;opacity:.8;cursor:pointer;padding:6px;line-height:0';
    b.innerHTML = OLHO;
    b.addEventListener('click', function() { const ver = el.type === 'password'; el.type = ver ? 'text' : 'password'; b.innerHTML = ver ? OLHO_CORTADO : OLHO; b.setAttribute('aria-label', ver ? 'Ocultar senha' : 'Mostrar senha'); });
    w.appendChild(b);
  }
  window.olhoSenha = olho;
  function prepararTelas() {
    if ($id('ir-criar')) return;
    $id('login-usuario').previousElementSibling.textContent = 'E-mail'; $id('login-usuario').type = 'email';
    const manter = $id('login-manter'); if (manter) manter.closest('.form-group').style.display = 'none';
    $id('btn-login').insertAdjacentHTML('afterend',
      '<p class="small" style="margin-top:14px;text-align:center"><a href="#" id="ir-esqueci">Esqueci minha senha</a></p>' +
      '<p class="small" style="margin-top:8px;text-align:center">Primeira vez? <a href="#" id="ir-criar">Criar conta</a></p>');
    $id('ir-criar').addEventListener('click', function(e) { e.preventDefault(); mostrarTela('setup'); });
    $id('ir-esqueci').addEventListener('click', async function(e) {
      e.preventDefault();
      const email = inputVal('login-usuario'); if (!email) { mostrarAlerta('login-error', 'Digite seu e-mail no campo acima e toque de novo em “Esqueci minha senha”.'); return; }
      mostrarAlerta('login-error', '');
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (r.error) { mostrarAlerta('login-error', msgErro(r.error.message)); return; }
      toast('Se o e-mail tiver conta, enviamos um link para criar a nova senha.', 'success', 9000);
    });
    olho($id('login-senha')); olho($id('setup-senha')); olho($id('setup-senha2'));
    const card = $id('setup-nome').closest('.card-auth');
    card.querySelector('h2').textContent = 'Criar conta';
    card.querySelector('p.muted').textContent = 'Use o e-mail que o administrador convidou.';
    $id('setup-nome').parentElement.insertAdjacentHTML('afterend', '<div class="form-group"><label class="form-label required">E-mail</label><input id="setup-email" type="email" class="form-input" autocomplete="email"></div>');
    $id('btn-setup').textContent = 'Criar conta';
    const p = card.querySelector('p.small'); if (p) p.innerHTML = 'Já tem conta? <a href="#" id="ir-entrar">Entrar</a>';
    $id('ir-entrar').addEventListener('click', function(e) { e.preventDefault(); mostrarTela('login'); });
  }

  // Link de "esqueci a senha": abre uma janela para definir a nova senha
  sb.auth.onAuthStateChange(function(ev) {
    if (ev !== 'PASSWORD_RECOVERY') return;
    setTimeout(function() {
      abrirModal('Criar nova senha',
        '<div class="form-group"><label class="form-label">Nova senha (mínimo 8 caracteres)</label><input id="ns-1" type="password" class="form-input" autocomplete="new-password"></div>' +
        '<div class="form-group"><label class="form-label">Repita a senha</label><input id="ns-2" type="password" class="form-input" autocomplete="new-password"></div>',
        '<button class="btn btn-primary" id="ns-salvar">Salvar nova senha</button>');
      olho($id('ns-1')); olho($id('ns-2'));
      $id('ns-salvar').addEventListener('click', async function() {
        const a = $id('ns-1').value, b = $id('ns-2').value;
        if (a.length < 8) { toast('A senha precisa ter ao menos 8 caracteres.', 'warn'); return; }
        if (a !== b) { toast('As senhas não conferem.', 'warn'); return; }
        const r = await sb.auth.updateUser({ password: a });
        if (r.error) { toast(msgErro(r.error.message), 'error', 8000); return; }
        fecharModal(); toast('Senha alterada.', 'success');
      });
    }, 600);
  });

  window.iniciarApp = async function() {
    document.addEventListener('keydown', function(ev) {
      if (ev.key === 'Escape') fecharModal();
      if (ev.key === 'Enter' && $id('screen-login').style.display === 'flex') fazerLogin();
    });
    prepararTelas();
    const s = (await sb.auth.getSession()).data.session;
    if (!s) { mostrarTela('login'); return; }
    try { const c = await ctx(); APP.token = s.access_token; APP.usuario = { id: c.user.id, nome: c.nome, usuario: c.user.email, role: c.role === 'owner' ? 'admin' : c.role }; entrarNoApp(); }
    catch (e) { await sb.auth.signOut(); CTX = null; mostrarTela('login'); mostrarAlerta('login-error', msgErro(e.message)); }
  };
  window.fazerLogin = async function() {
    const email = inputVal('login-usuario'), senha = $id('login-senha').value;
    mostrarAlerta('login-error', '');
    if (!email || !senha) { mostrarAlerta('login-error', 'Informe e-mail e senha.'); return; }
    const btn = $id('btn-login'); btn.disabled = true; btn.textContent = 'Entrando...';
    const r = await sb.auth.signInWithPassword({ email: email, password: senha });
    btn.disabled = false; btn.textContent = 'Entrar';
    if (r.error) { mostrarAlerta('login-error', msgErro(r.error.message)); return; }
    $id('login-senha').value = ''; CTX = null;
    window.iniciarApp();
  };
  window.executarSetup = async function() {
    const nome = inputVal('setup-nome'), email = inputVal('setup-email'), s1 = $id('setup-senha').value, s2 = $id('setup-senha2').value;
    mostrarAlerta('setup-error', '');
    if (!nome || !email) { mostrarAlerta('setup-error', 'Informe seu nome e e-mail.'); return; }
    if (s1.length < 8) { mostrarAlerta('setup-error', 'A senha precisa ter ao menos 8 caracteres.'); return; }
    if (s1 !== s2) { mostrarAlerta('setup-error', 'As senhas não conferem.'); return; }
    const btn = $id('btn-setup'); btn.disabled = true; btn.textContent = 'Criando...';
    const r = await sb.auth.signUp({ email: email, password: s1, options: { data: { nome: nome }, emailRedirectTo: location.origin + location.pathname } });
    btn.disabled = false; btn.textContent = 'Criar conta';
    if (r.error) { mostrarAlerta('setup-error', msgErro(r.error.message)); return; }
    $id('login-usuario').value = email; mostrarTela('login');
    toast('Conta criada. Enviamos um link de confirmação para ' + email + '. Confirme e depois entre.', 'success', 9000);
  };
  window.fazerLogout = async function(silencioso) {
    try { await sb.auth.signOut(); } catch (e) {}
    CTX = null; APP.token = null; APP.usuario = null; fecharModal(); mostrarTela('login');
    if (silencioso) mostrarAlerta('login-error', 'Sua sessão expirou. Entre novamente.');
  };
})();
</script>
