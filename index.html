  --warn: #fbbf24;
  --danger: #f87171;
  --radius: 16px;
  --sidebar-w: 248px;
  --tabbar-h: 64px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color: var(--text);
  background: var(--bg-0);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.45;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(900px 600px at 8% 0%, rgba(254,121,44,.28), transparent 60%),
    radial-gradient(900px 700px at 100% 100%, rgba(13,68,222,.38), transparent 60%),
    linear-gradient(160deg, var(--bg-1), var(--bg-0));
}
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
a { color: var(--orange-2); text-decoration: none; }
.muted { color: var(--text-2); }
.small { font-size: 12px; color: var(--text-3); }
[hidden] { display: none !important; }

/* glass */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  backdrop-filter: blur(18px) saturate(140%);
  box-shadow: 0 8px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.08);
}
.card { padding: 18px; }

/* telas de entrada */
.screen-center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card-auth { width: 100%; max-width: 400px; padding: 28px; }
.auth-logo { width: 72px; height: 72px; margin: 0 auto 14px; background: var(--logo-url) center/contain no-repeat; }
.card-auth h2 { text-align: center; margin-bottom: 4px; font-size: 20px; }
.card-auth p { text-align: center; margin: 0 0 18px; }

/* formulários */
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.form-label { font-size: 12px; font-weight: 500; color: var(--text-2); }
.form-label.required::after { content: ' *'; color: var(--orange); }
.form-input, select.form-input, textarea.form-input {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
  background: rgba(255,255,255,.06); border: 1px solid var(--glass-border); border-radius: 10px; outline: none;
  transition: border-color .15s, background .15s;
}
.form-input:focus { border-color: var(--orange); background: rgba(255,255,255,.1); }
.form-input::placeholder { color: var(--text-3); }
select.form-input option { background: #0b1233; color: var(--text); }
textarea.form-input { min-height: 78px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-check { display: flex; align-items: center; gap: 8px; color: var(--text-2); cursor: pointer; user-select: none; }
.form-check input { accent-color: var(--orange); width: 16px; height: 16px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 10px; border: 1px solid transparent; color: var(--text); cursor: pointer; transition: transform .1s, filter .15s, background .15s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn-primary { background: linear-gradient(135deg, var(--orange), #ff5f1a); color: #1a0b00; box-shadow: 0 6px 18px rgba(254,121,44,.35); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-secondary { background: var(--glass-2); border-color: var(--glass-border); }
.btn-secondary:hover { background: rgba(255,255,255,.18); }
.btn-blue { background: linear-gradient(135deg, var(--blue-2), var(--blue)); box-shadow: 0 6px 18px rgba(13,68,222,.4); }
.btn-danger { background: rgba(248,113,113,.18); border-color: rgba(248,113,113,.5); color: #fecaca; }
.btn-ghost { background: transparent; color: var(--text-2); }
.btn-ghost:hover { color: var(--text); background: var(--glass); }
.btn-full { width: 100%; }
.btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

/* alertas / badges */
.alert { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; border: 1px solid; }
.alert-error { background: rgba(248,113,113,.14); border-color: rgba(248,113,113,.45); color: #fecaca; }
.alert-info { background: rgba(61,107,255,.16); border-color: rgba(61,107,255,.45); color: #dbe4ff; }
.alert-ok { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.45); color: #bbf7d0; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--glass-border); background: var(--glass); color: var(--text-2); }
.badge-orange { background: rgba(254,121,44,.16); border-color: rgba(254,121,44,.5); color: var(--orange-2); }
.badge-blue { background: rgba(61,107,255,.18); border-color: rgba(61,107,255,.5); color: #b7c8ff; }
.badge-ok { background: rgba(52,211,153,.14); border-color: rgba(52,211,153,.45); color: #86efac; }
.badge-off { opacity: .6; }

/* layout do app */
#app { display: none; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); padding: 18px 14px; z-index: 20;
  display: flex; flex-direction: column; gap: 6px; border-radius: 0 var(--radius) var(--radius) 0;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-logo { width: 38px; height: 38px; background: var(--logo-url) center/contain no-repeat; flex: none; }
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.1; }
.brand-name small { display: block; font-weight: 500; font-size: 11px; color: var(--text-3); }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--text-2); cursor: pointer; font-weight: 500; border: 1px solid transparent; background: none; font-family: inherit; font-size: 14px; text-align: left; width: 100%; }
.nav-item svg { width: 18px; height: 18px; flex: none; }
.nav-item:hover { background: var(--glass); color: var(--text); }
.nav-item.active { background: linear-gradient(135deg, rgba(254,121,44,.22), rgba(13,68,222,.2)); border-color: var(--glass-border); color: var(--text); }
.sidebar-foot { margin-top: auto; padding: 10px 8px 0; border-top: 1px solid var(--glass-border); }
.sidebar-foot .user { font-weight: 600; }
.main { margin-left: calc(var(--sidebar-w) + 16px); padding: 20px 24px 40px; max-width: 1280px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.topbar h1 { font-size: 24px; }
.tabbar { display: none; }

/* toolbar / tabelas */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.toolbar .form-input { width: auto; min-width: 150px; }
.toolbar .grow { flex: 1 1 220px; }
.table-wrap { overflow-x: auto; }
table.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); padding: 10px 12px; border-bottom: 1px solid var(--glass-border); font-weight: 600; }
.table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: middle; }
.table tr:hover td { background: rgba(255,255,255,.04); }
.table .acoes { text-align: right; white-space: nowrap; }
.row-title { font-weight: 600; }
.empty { text-align: center; padding: 40px 16px; color: var(--text-3); }
.lista-cards { display: none; }

/* início */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 16px; }
.stat { padding: 18px; }
.stat .valor { font-size: 32px; font-weight: 700; margin: 4px 0; letter-spacing: -.02em; }
.stat .rotulo { color: var(--text-2); font-size: 13px; }
.stat.destaque .valor { color: var(--orange-2); }
.quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.quick { padding: 22px 12px; text-align: center; cursor: pointer; font: inherit; color: var(--text); font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.quick svg { width: 30px; height: 30px; color: var(--orange-2); }
.quick:hover { background: var(--glass-2); }
.quick .n { font-size: 12px; color: var(--text-3); font-weight: 500; }

/* simulador / resultado */
.resultado { padding: 16px; margin-top: 14px; }
.resultado .meses { font-size: 40px; font-weight: 700; color: var(--orange-2); line-height: 1; }
.linha-sim { display: grid; grid-template-columns: 70px minmax(150px, 1fr) minmax(0, 1fr) auto; gap: 8px; align-items: end; margin-bottom: 8px; }

/* modal */
.modal-overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(4,7,20,.62); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.modal-box { width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; background: rgba(15,22,56,.92); border: 1px solid var(--glass-border); border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.modal-box.grande { max-width: 820px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--glass-border); }
.modal-header h3 { font-size: 17px; }
.modal-close { background: none; border: 0; color: var(--text-2); font-size: 24px; line-height: 1; cursor: pointer; }
#modal-body { padding: 18px 20px; overflow-y: auto; }
#modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--glass-border); }
#modal-footer:empty { display: none; }

/* toast e carregamento */
.toast-container { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: calc(100vw - 32px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(15,22,56,.95); border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,.4); min-width: 240px; }
.toast-success { border-left: 3px solid var(--ok); }
.toast-error { border-left: 3px solid var(--danger); }
.toast-warn { border-left: 3px solid var(--warn); }
.toast-info { border-left: 3px solid var(--blue-2); }
.toast-close { background: none; border: 0; color: var(--text-2); cursor: pointer; font-size: 18px; }
.loading-bar-global { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 300; background: linear-gradient(90deg, var(--orange), var(--blue-2)); transition: width .3s; }
.loading-bar-global.on { width: 70%; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--glass-border); border-top-color: var(--orange); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.ghost { opacity: .4; }

/* celular */
@media (max-width: 860px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 14px 14px calc(var(--tabbar-h) + 24px); }
  .topbar h1 { font-size: 20px; }
  .so-desktop { display: none !important; }
  .form-grid { grid-template-columns: 1fr; }
  .quick-actions { grid-template-columns: 1fr; }
  .quick { flex-direction: row; justify-content: flex-start; padding: 18px; }
  .table-wrap { display: none; }
  .lista-cards { display: flex; flex-direction: column; gap: 10px; }
  .item-card { padding: 14px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .linha-sim { grid-template-columns: 1fr 1fr; }
  .tabbar { position: fixed; left: 10px; right: 10px; bottom: 10px; height: var(--tabbar-h); z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: none; border: 0; color: var(--text-3); font: inherit; font-size: 10.5px; font-weight: 600; border-radius: 12px; cursor: pointer; }
  .tab svg { width: 22px; height: 22px; }
  .tab.active { color: var(--orange-2); background: rgba(254,121,44,.12); }
  .toast-container { top: 10px; right: 10px; left: 10px; }
}
@media (min-width: 861px) { .so-mobile { display: none !important; } }
</style>

</head>
<body>
<div id="loading-bar-global" class="loading-bar-global"></div>
<div id="toast-container" class="toast-container"></div>

<div id="screen-boot" class="screen-center"><div class="spinner"></div></div>

<div id="screen-setup" class="screen-center" style="display:none">
  <div class="glass card-auth">
    <div class="auth-logo"></div>
    <h2>Primeiro acesso</h2>
    <p class="muted">Defina seu nome e a senha de administrador.</p>
    <div id="setup-error" class="alert alert-error" style="display:none"></div>
    <div class="form-group"><label class="form-label required">Seu nome</label><input id="setup-nome" class="form-input" autocomplete="name"></div>
    <div class="form-group"><label class="form-label required">Senha (mínimo 8 caracteres)</label><input id="setup-senha" type="password" class="form-input" autocomplete="new-password"></div>
    <div class="form-group"><label class="form-label required">Confirmar senha</label><input id="setup-senha2" type="password" class="form-input" autocomplete="new-password"></div>
    <button id="btn-setup" class="btn btn-primary btn-full" onclick="executarSetup()">Configurar sistema</button>
    <p class="small" style="margin-top:12px">Seu usuário de acesso será <b>admin</b>.</p>
  </div>
</div>

<div id="screen-login" class="screen-center" style="display:none">
  <div class="glass card-auth">
    <div class="auth-logo"></div>
    <h2>Domótica ERP</h2>
    <p class="muted">Acesse sua conta</p>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <div class="form-group"><label class="form-label">Usuário ou e-mail</label><input id="login-usuario" class="form-input" autocomplete="username"></div>
    <div class="form-group"><label class="form-label">Senha</label><input id="login-senha" type="password" class="form-input" autocomplete="current-password"></div>
    <div class="form-group"><label class="form-check"><input type="checkbox" id="login-manter"> Manter conectado neste aparelho</label></div>
    <button id="btn-login" class="btn btn-primary btn-full" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<div id="app">
  <aside class="sidebar glass">
    <div class="brand"><div class="brand-logo"></div><div class="brand-name">Domótica<small>Automação Residencial</small></div></div>
    <nav id="nav-lateral"></nav>
    <div class="sidebar-foot">
      <div class="user" id="user-nome"></div>
      <div class="small" id="user-papel"></div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;padding-left:0" onclick="fazerLogout()">Sair</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="view-title"></h1><div id="topbar-actions"></div></header>
    <div id="view-container"></div>
  </main>
  <nav class="tabbar glass" id="nav-tabbar"></nav>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="fecharModal()" aria-label="Fechar">×</button></div>
    <div id="modal-body"></div>
    <div id="modal-footer"></div>
  </div>
</div>

<script>
const APP = { token: null, usuario: null, view: null, params: {} };
const VIEWS = {};

const ICONES = {
  inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  clientes: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18 14.4c2.2.7 3.5 2.6 3.5 5.6"/>',
  catalogo: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  orcamentos: '<path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h5"/>',
  obras: '<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  dispositivos: '<path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L15.5 10"/>',
  agenda: '<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 3v3M16 3v3"/>',
  codigos: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 12h.01M12 12h.01M17 12h.01"/>',
  plantas: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h8M11 3v8M11 15v6M15 13h6"/>',
  mais: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
};
function icone(nome) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICONES[nome] || '') + '</svg>'; }

const NAV = [
  { id: 'inicio', label: 'Início' },
  { id: 'plantas', label: 'Plantas' },
  { id: 'orcamentos', label: 'Orçamentos' },
  { id: 'clientes', label: 'Clientes' },
  { id: 'catalogo', label: 'Catálogo' },
  { id: 'obras', label: 'Obras' },
  { id: 'dispositivos', label: 'Dispositivos' },
  { id: 'agenda', label: 'Agenda' },
  { id: 'codigos', label: 'Códigos' },
];
const NAV_TAB = ['inicio', 'plantas', 'clientes', 'catalogo'];

// ── Sessão local ─────────────────────────────────────────────
const DOM_SESS = {
  chave: 'DOM_SESS',
  gravar: function(token, usuario, manter) {
    try {
      (manter ? localStorage : sessionStorage).setItem(this.chave, JSON.stringify({ token: token, usuario: usuario }));
      (manter ? sessionStorage : localStorage).removeItem(this.chave);
    } catch (e) {}
  },
  ler: function() {
    try { const t = localStorage.getItem(this.chave) || sessionStorage.getItem(this.chave); return t ? JSON.parse(t) : null; } catch (e) { return null; }
  },
  limpar: function() { try { localStorage.removeItem(this.chave); sessionStorage.removeItem(this.chave); } catch (e) {} },
};

// ── Utilitários ──────────────────────────────────────────────
function escHtml(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $id(id) { return document.getElementById(id); }
function inputVal(id) { const e = $id(id); return e ? e.value.trim() : ''; }
function checkVal(id) { const e = $id(id); return !!(e && e.checked); }
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function debounce(fn, ms) { let t; return function() { const a = arguments, self = this; clearTimeout(t); t = setTimeout(function() { fn.apply(self, a); }, ms); }; }
function fmtMoeda(n) { if (n === '' || n === null || n === undefined || isNaN(Number(n))) return '—'; return Number(n).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtData(str) {
  if (!str) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(str));
  return m ? m[3] + '/' + m[2] + '/' + m[1] : String(str);
}
function soDigitos(s) { return String(s || '').replace(/\D/g, ''); }

// Nome do site a que um link pertence (para mostrar ao lado do produto e na mensagem ao cliente).
function nomeLoja(url) {
  let h = '';
  try { h = new URL(String(url || '').trim()).hostname.toLowerCase().replace(/^www\./, ''); } catch (e) { return ''; }
  const mapa = [
    [/mercadolivre\.com|mercadolibre\.com|(^|\.)meli\.la$/, 'Mercado Livre'], [/shopee\.|collshp\.com|(^|\.)shp\.ee$/, 'Shopee'],
    [/amazon\.|(^|\.)amzn\.to$|(^|\.)a\.co$/, 'Amazon'], [/magazineluiza|magalu/, 'Magalu'], [/aliexpress\./, 'AliExpress'],
    [/kabum\.com/, 'KaBuM!'], [/americanas\./, 'Americanas'], [/casasbahia|pontofrio/, 'Casas Bahia'],
  ];
  for (let i = 0; i < mapa.length; i++) if (mapa[i][0].test(h)) return mapa[i][1];
  return h;
}

// "Nome — R$ 99,90 (Loja)" + link, usado ao compartilhar um produto ou a lista de um cliente.
function linhaProduto(p) {
  const loja = nomeLoja(p.LINK_COMISSAO), preco = fmtMoeda(p.PRECO_APARELHO);
  return p.NOME + (preco !== '—' ? ' — ' + preco : '') + (loja ? ' (' + loja + ')' : '') + '\n' + p.LINK_COMISSAO;
}

function copiarTexto(texto) {
  const fim = function(ok) { toast(ok ? 'Copiado.' : 'Não consegui copiar. Selecione o texto e copie manualmente.', ok ? 'success' : 'warn'); };
  const antigo = function() {
    try {
      const t = document.createElement('textarea');
      t.value = texto; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.appendChild(t); t.select();
      const ok = document.execCommand('copy'); t.remove(); return ok;
    } catch (e) { return false; }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(texto).then(function() { fim(true); }, function() { fim(antigo()); });
  else fim(antigo());
}

// Número do WhatsApp no formato internacional (Brasil). Vazio se não parecer um telefone.
function numeroWhatsapp(tel) {
  const d = soDigitos(tel);
  if (d.length === 10 || d.length === 11) return '55' + d;
  if ((d.length === 12 || d.length === 13) && d.indexOf('55') === 0) return d;
  return '';
}

// Janela com a mensagem editável, botão de copiar e botão do WhatsApp (abre direto na conversa se houver telefone).
function abrirCompartilhar(titulo, mensagem, telefone) {
  const num = numeroWhatsapp(telefone);
  abrirModal(titulo,

  $id('cp-copiar').addEventListener('click', function() { copiarTexto(ta.value); });

function maskTelefone(el) {
  el.addEventListener('input', function() {
    const d = soDigitos(el.value).slice(0, 11);
    let r = d;
    if (d.length > 10) r = '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
    else if (d.length > 6) r = '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    else if (d.length > 2) r = '(' + d.slice(0, 2) + ') ' + d.slice(2);
    el.value = r;
  });
}
function maskCEP(el) {
  el.addEventListener('input', function() {
    const d = soDigitos(el.value).slice(0, 8);
    el.value = d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;

// ── Toast / carregamento ─────────────────────────────────────
function toast(msg, tipo, duracao) {
  tipo = tipo || 'success'; duracao = duracao || 4000;
  const box = $id('toast-container'); if (!box) return;
  const icons = { success: '✓', error: '✕', warn: '⚠', info: 'ℹ' };
  const t = document.createElement('div');
  t.className = 'toast toast-' + tipo;
  t.innerHTML = '<span>' + (icons[tipo] || '•') + '</span><span style="flex:1">' + escHtml(msg) + '</span><button class="toast-close" onclick="this.parentElement.remove()">×</button>';
  box.appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = '300ms'; setTimeout(function() { t.remove(); }, 300); }, duracao);
}
let _pendentes = 0;
function _carregando(on) {
  _pendentes = Math.max(0, _pendentes + (on ? 1 : -1));
  const b = $id('loading-bar-global'); if (b) b.classList.toggle('on', _pendentes > 0);
}

// ── Backend ──────────────────────────────────────────────────
function chamarBackend(fn, args, onSuccess, onError) {
  _carregando(true);
  const call = google.script.run
    .withSuccessHandler(function(res) {
      _carregando(false);
      // Resposta nula = valor não serializável no retorno (ex.: Date cru).
      if (!res) { if (onError) onError('Resposta vazia'); else toast('Resposta vazia do servidor em ' + fn + '.', 'error'); return; }
      if (!res.success) {
        if (res.error === 'SESSAO_INVALIDA') { fazerLogout(true); return; }
        if (onError) onError(res.error || 'Erro desconhecido'); else toast(res.error || 'Erro ao processar.', 'error');
        return;
      }
      if (onSuccess) {
        try { onSuccess(res.data); } catch (e) { toast('Erro ao processar ' + fn + ': ' + e.message, 'error'); }
      }
    })
    .withFailureHandler(function(err) {
      _carregando(false);
      const msg = (err && err.message) || 'Erro de conexão.';
      if (onError) onError(msg); else toast(msg, 'error');
    });
  call[fn].apply(call, args || []);
}

// ── Telas de entrada ─────────────────────────────────────────
function mostrarTela(qual) {
  ['boot', 'setup', 'login'].forEach(function(t) { const e = $id('screen-' + t); if (e) e.style.display = (t === qual) ? 'flex' : 'none'; });
  $id('app').style.display = (qual === 'app') ? 'block' : 'none';
}
function mostrarAlerta(id, msg) { const e = $id(id); if (!e) return; e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

function iniciarApp() {
  document.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') fecharModal();
    if (ev.key === 'Enter' && $id('screen-login').style.display === 'flex') fazerLogin();
  });
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.data && res.data.precisaSetup) { mostrarTela('setup'); return; }
      const sess = DOM_SESS.ler();
      if (!sess || !sess.token) { mostrarTela('login'); return; }
      APP.token = sess.token;
      chamarBackend('obterMeuUsuario', [APP.token], function(u) { APP.usuario = u; entrarNoApp(); }, function() { DOM_SESS.limpar(); APP.token = null; mostrarTela('login'); });
    })
    .withFailureHandler(function(err) { mostrarTela('login'); mostrarAlerta('login-error', 'Falha ao conectar: ' + ((err && err.message) || 'tente recarregar.')); })
    .verificarStatusSistema();
}

function executarSetup() {
  const nome = inputVal('setup-nome');
  const s1 = $id('setup-senha').value;
  const s2 = $id('setup-senha2').value;
  mostrarAlerta('setup-error', '');
  if (!nome) { mostrarAlerta('setup-error', 'Informe seu nome.'); return; }
  if (s1.length < 8) { mostrarAlerta('setup-error', 'A senha precisa ter ao menos 8 caracteres.'); return; }
  if (s1 !== s2) { mostrarAlerta('setup-error', 'As senhas não conferem.'); return; }
  const btn = $id('btn-setup'); btn.disabled = true; btn.textContent = 'Configurando...';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = 'Configurar sistema';
      if (!res || !res.success) { mostrarAlerta('setup-error', res ? res.error : 'Erro desconhecido.'); return; }
      $id('login-usuario').value = 'admin';
      mostrarTela('login');
      toast('Sistema configurado. Entre com o usuário admin.', 'success');
    })
    .withFailureHandler(function(err) { btn.disabled = false; btn.textContent = 'Configurar sistema'; mostrarAlerta('setup-error', (err && err.message) || 'Erro de conexão.'); })
    .executarSetupInicial(s1, nome);
}

function fazerLogin() {
  const id = inputVal('login-usuario');
  const senha = $id('login-senha').value;
  const manter = checkVal('login-manter');
  mostrarAlerta('login-error', '');
  if (!id || !senha) { mostrarAlerta('login-error', 'Informe usuário e senha.'); return; }
  const btn = $id('btn-login'); btn.disabled = true; btn.textContent = 'Entrando...';
  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false; btn.textContent = 'Entrar';
      if (!res || !res.success) { mostrarAlerta('login-error', res ? res.error : 'Erro desconhecido.'); return; }
      APP.token = res.data.token; APP.usuario = res.data.usuario;
      DOM_SESS.gravar(APP.token, APP.usuario, manter);
      $id('login-senha').value = '';
      entrarNoApp();
    })
    .withFailureHandler(function(err) { btn.disabled = false; btn.textContent = 'Entrar'; mostrarAlerta('login-error', 'Erro ao conectar: ' + ((err && err.message) || 'tente novamente.')); })
    .login(id, senha, manter);
}

function fazerLogout(silencioso) {
  const token = APP.token;
  DOM_SESS.limpar(); APP.token = null; APP.usuario = null;
  if (token && !silencioso) { try { google.script.run.logout(token); } catch (e) {} }
  fecharModal();
  mostrarTela('login');
  if (silencioso) mostrarAlerta('login-error', 'Sua sessão expirou. Entre novamente.');
}

function _recriarEl(id) {
  const velho = $id(id);
  const novo = velho.cloneNode(false);
  velho.parentNode.replaceChild(novo, velho);
  return novo;
}

function navegar(view, params) {
  if (!VIEWS[view]) { toast('Tela não encontrada: ' + view, 'error'); return; }
  APP.view = view; APP.params = params || {};
  document.querySelectorAll('[data-nav]').forEach(function(el) { el.classList.toggle('active', el.getAttribute('data-nav') === view); });
  $id('view-title').textContent = VIEWS[view].titulo;
  // Recria os contêineres para descartar os listeners da tela anterior.
  const c = _recriarEl('view-container');
  _recriarEl('topbar-actions');
  try { VIEWS[view].render(c, APP.params); }
  catch (e) { c.innerHTML = '<div class="alert alert-error">Erro ao abrir a tela: ' + escHtml(e.message) + '</div>'; }
  window.scrollTo(0, 0);
}

// ── Modal ────────────────────────────────────────────────────
function abrirModal(titulo, html, footerHtml, classes) {
  $id('modal-title').textContent = titulo;
  $id('modal-body').innerHTML = html;
  $id('modal-footer').innerHTML = footerHtml || '';
  document.querySelector('.modal-box').className = 'modal-box' + (classes ? ' ' + classes : '');
  $id('modal-overlay').style.display = 'flex';
}
function fecharModal() { const o = $id('modal-overlay'); if (o) o.style.display = 'none'; }

let _confirmCb = null;
function confirmarAcao(mensagem, onConfirmar, opcoes) {
  opcoes = opcoes || {};
  _confirmCb = onConfirmar;
  abrirModal(opcoes.titulo || 'Confirmar ação', '<p class="muted" style="margin:0;line-height:1.5">' + escHtml(mensagem) + '</p>',
    '<button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button><button class="btn ' + (opcoes.perigo ? 'btn-danger' : 'btn-primary') + '" onclick="_executarConfirm()">' + escHtml(opcoes.textoConfirmar || 'Confirmar') + '</button>');
}
function _executarConfirm() { const cb = _confirmCb; _confirmCb = null; fecharModal(); if (cb) cb(); }

<script>
(function() {
  const CLI = { lista: [], busca: '', status: 'ativo', tipo: '', carregado: false, catalogo: null, vinculos: null };
  let SEL = null, PBUSCA = '';

  VIEWS.clientes = {
    titulo: 'Clientes',
    render: function(c, params) {
      $id('topbar-actions').innerHTML = '<button class="btn btn-primary" data-acao="novo">+ Novo cliente</button>';
      c.innerHTML =
        '<div class="toolbar">' +
          '<input id="cli-busca" class="form-input grow" placeholder="Buscar por nome, telefone, cidade..." value="' + escHtml(CLI.busca) + '">' +
          '<select id="cli-status" class="form-input"><option value="ativo">Ativos</option><option value="arquivado">Arquivados</option><option value="todos">Todos</option></select>' +
          '<select id="cli-tipo" class="form-input"><option value="">Todos os tipos</option><option value="residencial">Residencial</option><option value="comercial">Comercial</option></select>' +
        '</div>' +
        '<div id="cli-lista"><div class="glass card empty">Carregando...</div></div>';
      $id('cli-status').value = CLI.status;
      $id('cli-tipo').value = CLI.tipo;
      $id('cli-busca').addEventListener('input', debounce(function(e) { CLI.busca = e.target.value; renderLista(); }, 200));
      $id('cli-status').addEventListener('change', function(e) { CLI.status = e.target.value; renderLista(); });
      $id('cli-tipo').addEventListener('change', function(e) { CLI.tipo = e.target.value; renderLista(); });
      const acao = function(e) {
        const el = e.target.closest('[data-acao]'); if (!el) return;
        const id = el.getAttribute('data-id');
        if (el.getAttribute('data-acao') === 'novo') abrirForm(null);
        else if (el.getAttribute('data-acao') === 'editar') abrirForm(id);
        else if (el.getAttribute('data-acao') === 'arquivar') arquivar(id, true);
        else if (el.getAttribute('data-acao') === 'reativar') arquivar(id, false);
        else if (el.getAttribute('data-acao') === 'lista') compartilharLista(id);
      };
      c.addEventListener('click', acao);
      $id('topbar-actions').addEventListener('click', acao);
      if (CLI.carregado) renderLista();
      chamarBackend('listarCatalogo', [APP.token], function(l) { CLI.catalogo = l; pintaProdutos(); });
      chamarBackend('listarVinculosClientes', [APP.token], function(l) { CLI.vinculos = l; renderLista(); pintaProdutos(); });
      chamarBackend('listarClientes', [APP.token], function(lista) {
        CLI.lista = lista; CLI.carregado = true; renderLista();
        if (params && params.novo) { params.novo = false; abrirForm(null); }
      });
    },
  };

  function filtrados() {
    const q = norm(CLI.busca);
    return CLI.lista.filter(function(c) {
      if (CLI.status !== 'todos' && (c.STATUS || 'ativo') !== CLI.status) return false;
      if (CLI.tipo && c.TIPO !== CLI.tipo) return false;
      if (!q) return true;
      return norm([c.NOME, c.TELEFONE, c.WHATSAPP, c.EMAIL, c.CIDADE, c.BAIRRO, c.ENDERECO].join(' ')).indexOf(q) > -1;
    });
  }

  function tipoBadge(t) { return t === 'comercial' ? '<span class="badge badge-blue">Comercial</span>' : '<span class="badge badge-orange">Residencial</span>'; }
  function endereco(c) { return [c.ENDERECO, c.BAIRRO, c.CIDADE].filter(Boolean).join(', '); }

  // ── Produtos associados ao cliente ──
  function ehAtivo(p) { return p.ATIVO === true || p.ATIVO === 'TRUE'; }
  function elegiveis() { return (CLI.catalogo || []).filter(function(p) { return ehAtivo(p) && p.LINK_COMISSAO; }); }
  function idsDoCliente(idCliente) { return (CLI.vinculos || []).filter(function(v) { return v.ID_CLIENTE === idCliente; }).map(function(v) { return v.ID_PRODUTO; }); }
  function produtosDoCliente(idCliente) {
    const ids = {}; idsDoCliente(idCliente).forEach(function(i) { ids[i] = true; });
    return elegiveis().filter(function(p) { return ids[p.ID_PRODUTO]; });
  }
  function selecionados() { return SEL ? Object.keys(SEL) : []; }

  function pintaProdutos() {
    const box = $id('fc-plista'); if (!box) return;
    if (!CLI.catalogo || !CLI.vinculos) { box.innerHTML = '<div class="small">Carregando produtos...</div>'; return; }
    if (SEL === null) { SEL = {}; idsDoCliente(box.getAttribute('data-cliente') || '').forEach(function(i) { SEL[i] = true; }); }
    const q = norm(PBUSCA);
    const l = elegiveis().filter(function(p) { return !q || norm([p.NOME, p.MARCA, p.CATEGORIA].join(' ')).indexOf(q) > -1; });
    box.innerHTML = l.length ? l.map(function(p) {
      const img = p.IMAGEM_URL ? '<img src="' + escHtml(p.IMAGEM_URL) + '" alt="" referrerpolicy="no-referrer" loading="lazy" style="width:36px;height:36px;flex:none;object-fit:contain;border-radius:6px;background:#fff">' : '<span style="width:36px;height:36px;flex:none"></span>';
      return '<label style="display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer"><input type="checkbox" data-p="' + escHtml(p.ID_PRODUTO) + '"' + (SEL[p.ID_PRODUTO] ? ' checked' : '') + '>' + img +
        '<span><span class="row-title" style="display:block">' + escHtml(p.NOME) + '</span><span class="small">' + escHtml([nomeLoja(p.LINK_COMISSAO), fmtMoeda(p.PRECO_APARELHO)].filter(Boolean).join(' · ')) + '</span></span></label>';
    }).join('') : '<div class="small">' + (elegiveis().length ? 'Nenhum produto com essa busca.' : 'Nenhum produto com link de comissão no catálogo.') + '</div>';
    const c = $id('fc-pconta'); if (c) c.textContent = selecionados().length + ' produto(s) marcado(s) para este cliente.';
  }

  function compartilharLista(id) {
    const c = CLI.lista.filter(function(x) { return x.ID_CLIENTE === id; })[0]; if (!c) return;
    if (!CLI.catalogo || !CLI.vinculos) { toast('Aguarde o catálogo carregar e tente de novo.', 'info'); return; }
    const prods = produtosDoCliente(id);
    if (!prods.length) { toast('Nenhum produto associado a ' + c.NOME + '. Use “Editar” e marque os produtos.', 'warn', 6000); return; }
    // Só os links, um por linha, sem frases (é como o dono sempre envia).
    const texto = prods.map(function(p) { return p.LINK_COMISSAO; }).join('\n\n');
    abrirCompartilhar('Lista de produtos de ' + c.NOME, texto, c.WHATSAPP || c.TELEFONE);
  }

  function contagem(c) { const n = idsDoCliente(c.ID_CLIENTE).length; return n ? '<div class="small"><span class="badge badge-blue">' + n + ' produto(s) indicado(s)</span></div>' : ''; }
  function botaoLista(c) { return idsDoCliente(c.ID_CLIENTE).length ? '<button class="btn btn-secondary btn-sm" data-acao="lista" data-id="' + escHtml(c.ID_CLIENTE) + '">Enviar lista</button> ' : ''; }

  function renderLista() {
    const box = $id('cli-lista'); if (!box) return;
    const l = filtrados();
    if (!l.length) { box.innerHTML = '<div class="glass card empty">' + (CLI.lista.length ? 'Nenhum cliente com esses filtros.' : 'Nenhum cliente cadastrado ainda. Use “+ Novo cliente”.') + '</div>'; return; }
    const linhas = l.map(function(c) {
      const arq = (c.STATUS || 'ativo') === 'arquivado';
      return '<tr><td><div class="row-title">' + escHtml(c.NOME) + (arq ? ' <span class="badge badge-off">Arquivado</span>' : '') + '</div><div class="small">' + escHtml(endereco(c)) + '</div>' + contagem(c) + '</td>' +
        '<td>' + tipoBadge(c.TIPO) + '</td><td>' + escHtml(c.WHATSAPP || c.TELEFONE || '—') + '</td><td>' + escHtml(c.EMAIL || '—') + '</td>' +
        '<td class="acoes">' + botaoLista(c) + '<button class="btn btn-secondary btn-sm" data-acao="editar" data-id="' + escHtml(c.ID_CLIENTE) + '">Editar</button> ' +
        '<button class="btn btn-ghost btn-sm" data-acao="' + (arq ? 'reativar' : 'arquivar') + '" data-id="' + escHtml(c.ID_CLIENTE) + '">' + (arq ? 'Reativar' : 'Arquivar') + '</button></td></tr>';
    }).join('');
    const cards = l.map(function(c) {
      return '<div class="glass item-card" data-acao="editar" data-id="' + escHtml(c.ID_CLIENTE) + '"><div class="row-title">' + escHtml(c.NOME) + '</div>' +
        '<div>' + tipoBadge(c.TIPO) + '</div><div class="small">' + escHtml(endereco(c) || '—') + '</div><div class="small">' + escHtml(c.WHATSAPP || c.TELEFONE || '') + '</div>' + contagem(c) + (idsDoCliente(c.ID_CLIENTE).length ? '<div style="margin-top:6px">' + botaoLista(c) + '</div>' : '') + '</div>';
    }).join('');
    box.innerHTML = '<div class="glass card table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Tipo</th><th>Telefone</th><th>E-mail</th><th></th></tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      '<div class="lista-cards">' + cards + '</div>';
  }

  function abrirForm(id) {
    const c = id ? CLI.lista.filter(function(x) { return x.ID_CLIENTE === id; })[0] : null;
    if (id && !c) return;
    const v = function(k) { return escHtml(c ? c[k] : ''); };
    abrirModal(c ? 'Editar cliente' : 'Novo cliente',
      '<div class="form-grid">' +
        '<div class="form-group full"><label class="form-label required">Nome</label><input id="fc-nome" class="form-input" value="' + v('NOME') + '"></div>' +
        '<div class="form-group"><label class="form-label">Tipo</label><select id="fc-tipo" class="form-input"><option value="residencial">Residencial</option><option value="comercial">Comercial</option></select></div>' +
        '<div class="form-group"><label class="form-label">WhatsApp</label><input id="fc-whatsapp" class="form-input" inputmode="tel" value="' + v('WHATSAPP') + '"></div>' +
        '<div class="form-group"><label class="form-label">Telefone</label><input id="fc-telefone" class="form-input" inputmode="tel" value="' + v('TELEFONE') + '"></div>' +
        '<div class="form-group"><label class="form-label">E-mail</label><input id="fc-email" type="email" class="form-input" value="' + v('EMAIL') + '"></div>' +
        '<div class="form-group full"><label class="form-label">Endereço</label><input id="fc-endereco" class="form-input" value="' + v('ENDERECO') + '"></div>' +
        '<div class="form-group"><label class="form-label">Bairro</label><input id="fc-bairro" class="form-input" value="' + v('BAIRRO') + '"></div>' +
        '<div class="form-group"><label class="form-label">Cidade</label><input id="fc-cidade" class="form-input" value="' + v('CIDADE') + '"></div>' +
        '<div class="form-group"><label class="form-label">Estado</label><input id="fc-estado" class="form-input" maxlength="2" value="' + v('ESTADO') + '"></div>' +
        '<div class="form-group"><label class="form-label">CEP</label><input id="fc-cep" class="form-input" inputmode="numeric" value="' + v('CEP') + '"></div>' +
        '<div class="form-group full"><label class="form-label">Observações</label><textarea id="fc-obs" class="form-input">' + v('OBSERVACOES') + '</textarea></div>' +
        '<div class="form-group full"><label class="form-label">Produtos para o cliente comprar (links com comissão)</label>' +
          '<input id="fc-pbusca" class="form-input" placeholder="Buscar produto..."><div id="fc-plista" data-cliente="' + escHtml(id || '') + '" style="max-height:220px;overflow:auto;margin-top:6px"></div><div class="small" id="fc-pconta"></div></div>' +
      '</div>',
      '<button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" id="fc-salvar">Salvar</button>');
    $id('fc-tipo').value = c && c.TIPO ? c.TIPO : 'residencial';
    maskTelefone($id('fc-whatsapp')); maskTelefone($id('fc-telefone')); maskCEP($id('fc-cep'));
    SEL = null; PBUSCA = '';
    $id('fc-pbusca').addEventListener('input', debounce(function(e) { PBUSCA = e.target.value; pintaProdutos(); }, 150));
    $id('fc-plista').addEventListener('change', function(e) {
      const p = e.target.getAttribute('data-p'); if (!p || SEL === null) return;
      if (e.target.checked) SEL[p] = true; else delete SEL[p];
      $id('fc-pconta').textContent = selecionados().length + ' produto(s) marcado(s) para este cliente.';
    });
    pintaProdutos();
    $id('fc-salvar').addEventListener('click', function() { salvar(id); });
    setTimeout(function() { const e = $id('fc-nome'); if (e) e.focus(); }, 50);
  }

  function salvar(id) {
    const dados = {
      ID_CLIENTE: id || '', NOME: inputVal('fc-nome'), TIPO: $id('fc-tipo').value, WHATSAPP: inputVal('fc-whatsapp'), TELEFONE: inputVal('fc-telefone'),
      EMAIL: inputVal('fc-email'), ENDERECO: inputVal('fc-endereco'), BAIRRO: inputVal('fc-bairro'), CIDADE: inputVal('fc-cidade'),
      ESTADO: inputVal('fc-estado').toUpperCase(), CEP: inputVal('fc-cep'), OBSERVACOES: inputVal('fc-obs'),
    };
    if (!dados.NOME) { toast('Informe o nome do cliente.', 'warn'); return; }
    const btn = $id('fc-salvar'); btn.disabled = true;
    chamarBackend('salvarCliente', [APP.token, dados], function(reg) {
      const i = CLI.lista.findIndex(function(x) { return x.ID_CLIENTE === reg.ID_CLIENTE; });
      if (i > -1) CLI.lista[i] = reg; else CLI.lista.push(reg);
      CLI.lista.sort(function(a, b) { return String(a.NOME).localeCompare(String(b.NOME), 'pt-BR'); });
      const concluir = function() { fecharModal(); renderLista(); toast(id ? 'Cliente atualizado.' : 'Cliente cadastrado.'); };
      // Só mexe nos produtos se a lista foi carregada e mudou (nunca apaga por engano).
      const depois = SEL === null ? null : selecionados().sort().join('|');
      if (depois === null || depois === idsDoCliente(reg.ID_CLIENTE).sort().join('|')) { concluir(); return; }
      chamarBackend('salvarProdutosDoCliente', [APP.token, reg.ID_CLIENTE, selecionados()], function(r) {
        CLI.vinculos = CLI.vinculos.filter(function(v) { return v.ID_CLIENTE !== r.ID_CLIENTE; }).concat(r.ids.map(function(p) { return { ID_CLIENTE: r.ID_CLIENTE, ID_PRODUTO: p }; }));
        concluir();
      }, function(err) { toast('Cliente salvo, mas os produtos não foram associados: ' + err, 'error', 8000); concluir(); });
    }, function(err) { btn.disabled = false; toast(err, 'error'); });
  }

  function arquivar(id, arquivarFlag) {
    const c = CLI.lista.filter(function(x) { return x.ID_CLIENTE === id; })[0]; if (!c) return;
    const fazer = function() {
      chamarBackend('arquivarCliente', [APP.token, id, arquivarFlag], function(reg) {
        const i = CLI.lista.findIndex(function(x) { return x.ID_CLIENTE === id; });
        if (i > -1) CLI.lista[i] = reg;
        renderLista(); toast(arquivarFlag ? 'Cliente arquivado.' : 'Cliente reativado.');
      });
    };
    if (arquivarFlag) confirmarAcao('Arquivar ' + c.NOME + '? Ele sai da lista de ativos, mas o histórico continua guardado.', fazer, { textoConfirmar: 'Arquivar' });
    else fazer();
  }
})();
</script>

<script>
(function() {
  const CATEGORIAS = ['Interruptor', 'Tomada', 'Iluminação', 'Sensor', 'Câmera', 'Fechadura', 'Assistente de voz', 'Som ambiente', 'Persiana / cortina', 'Climatização', 'Portão', 'Rede / Wi-Fi', 'Outros'];
  const CAIXAS = ['', '4x2', '4x4', 'Embutir', 'Sobrepor', 'Outro'];
  const CAT = { lista: [], busca: '', categoria: '', origem: '', ativo: 'ativos', carregado: false };

  VIEWS.catalogo = {
    titulo: 'Catálogo',
    render: function(c) {
      $id('topbar-actions').innerHTML = '<button class="btn btn-secondary" data-acao="planilha">Planilha de links</button> <button class="btn btn-secondary" data-acao="precos">Atualizar preços</button> <button class="btn btn-secondary" data-acao="importar">Importar</button> <button class="btn btn-primary" data-acao="novo">+ Novo produto</button>';
      c.innerHTML =
        '<div class="toolbar">' +
          '<input id="cat-busca" class="form-input grow" placeholder="Buscar por nome, marca ou app..." value="' + escHtml(CAT.busca) + '">' +
          '<select id="cat-categoria" class="form-input"><option value="">Todas as categorias</option>' + CATEGORIAS.map(function(x) { return '<option>' + x + '</option>'; }).join('') + '</select>' +
          '<select id="cat-origem" class="form-input"><option value="">Qualquer origem</option><option value="domotica">Fornecido por mim</option><option value="indicado">Indicado (link)</option></select>' +
          '<select id="cat-ativo" class="form-input"><option value="ativos">Ativos</option><option value="inativos">Inativos</option><option value="todos">Todos</option></select>' +
        '</div>' +
        '<div id="cat-lista"><div class="glass card empty">Carregando...</div></div>';
      $id('cat-categoria').value = CAT.categoria; $id('cat-origem').value = CAT.origem; $id('cat-ativo').value = CAT.ativo;
      $id('cat-busca').addEventListener('input', debounce(function(e) { CAT.busca = e.target.value; renderLista(); }, 200));
      $id('cat-categoria').addEventListener('change', function(e) { CAT.categoria = e.target.value; renderLista(); });
      $id('cat-origem').addEventListener('change', function(e) { CAT.origem = e.target.value; renderLista(); });
      $id('cat-ativo').addEventListener('change', function(e) { CAT.ativo = e.target.value; renderLista(); });
      const acao = function(e) {
        const el = e.target.closest('[data-acao]'); if (!el) return;
        const id = el.getAttribute('data-id'); const a = el.getAttribute('data-acao');
        if (a === 'novo') abrirForm(null);
        else if (a === 'precos') atualizarPrecos();
        else if (a === 'importar') abrirImportacaoCatalogo(function() {
          chamarBackend('listarCatalogo', [APP.token], function(lista) { CAT.lista = lista; CAT.carregado = true; renderLista(); });
        });
        else if (a === 'editar') abrirForm(id);
        else if (a === 'planilha') gerarPlanilha();
        else if (a === 'comprar') return; // link normal (abre em nova aba); só impede abrir a edição
        else if (a === 'compartilhar') compartilhar(id);
        else if (a === 'ativar') alternarAtivo(id, true);
        else if (a === 'desativar') alternarAtivo(id, false);
      };
      c.addEventListener('click', acao);
      $id('topbar-actions').addEventListener('click', acao);
      if (CAT.carregado) renderLista();
      chamarBackend('listarCatalogo', [APP.token], function(lista) { CAT.lista = lista; CAT.carregado = true; renderLista(); });
    },
  };

  function ehAtivo(p) { return p.ATIVO === true || p.ATIVO === 'TRUE'; }

  function filtrados() {
    const q = norm(CAT.busca);
    return CAT.lista.filter(function(p) {
      if (CAT.ativo === 'ativos' && !ehAtivo(p)) return false;
      if (CAT.ativo === 'inativos' && ehAtivo(p)) return false;
      if (CAT.categoria && p.CATEGORIA !== CAT.categoria) return false;
      if (CAT.origem && p.ORIGEM !== CAT.origem) return false;
      return !q || norm([p.NOME, p.MARCA, p.APP_CONTROLE, p.CATEGORIA].join(' ')).indexOf(q) > -1;
    });
  }

  function avisoPreco(p) {
    let h = '';
    if (p.PRECO_ANTERIOR !== '' && p.PRECO_ANTERIOR !== undefined && Number(p.PRECO_ANTERIOR) !== Number(p.PRECO_APARELHO)) {
      const subiu = Number(p.PRECO_APARELHO) > Number(p.PRECO_ANTERIOR);
      h += '<div class="small" style="color:' + (subiu ? '#dc2626' : '#16a34a') + '">' + (subiu ? '▲' : '▼') + ' antes ' + fmtMoeda(p.PRECO_ANTERIOR) + (p.PRECO_ATUALIZADO_EM ? ' · ' + fmtData(p.PRECO_ATUALIZADO_EM) : '') + '</div>';
    }
    if (p.FORA_DA_LISTA === true || p.FORA_DA_LISTA === 'TRUE') h += '<div class="small" style="color:#b45309">⚠ saiu da lista</div>';
    return h;
  }

  function gerarPlanilha() {
    toast('Montando a planilha de links...', 'info', 3000);
    chamarBackend('gerarPlanilhaLinks', [APP.token], function(r) {
      abrirModal('Planilha de links pronta',
        '<p style="margin:0 0 8px">' + r.produtos + ' produto(s) e ' + r.vinculos + ' vínculo(s) de clientes, só com os links de comissão.</p><p class="small" style="margin:0">Cada vez que você clicar em “Planilha de links”, ela é gerada de novo com os dados de agora.</p>',
        '<button class="btn btn-secondary" onclick="fecharModal()">Fechar</button><a class="btn btn-primary" ' + (r.arquivo ? 'download="' + escHtml(r.arquivo) + '"' : 'target="_blank" rel="noopener"') + ' style="text-decoration:none" href="' + escHtml(r.url) + '">' + (r.arquivo ? 'Baixar planilha' : 'Abrir planilha') + '</a>');
    }, function(err) { toast(err, 'error', 8000); });
  }

  function atualizarPrecos() {
    toast('Lendo a lista do Mercado Livre...', 'info', 3000);
    chamarBackend('atualizarPrecosAgora', [APP.token], function(r) {
      const msg = r.alterados.length + ' preço(s) alterado(s), ' + r.sumiram.length + ' saiu(ram) da lista, ' + r.verificados + ' produto(s) verificado(s).';
      toast(msg, r.alterados.length || r.sumiram.length ? 'warn' : 'success', 8000);
      chamarBackend('listarCatalogo', [APP.token], function(lista) { CAT.lista = lista; renderLista(); });
    }, function(err) { toast(err, 'error', 8000); });
  }

  function miniatura(p) {
    return p.IMAGEM_URL ? '<img src="' + escHtml(p.IMAGEM_URL) + '" alt="" referrerpolicy="no-referrer" loading="lazy" style="width:44px;height:44px;flex:none;object-fit:contain;border-radius:8px;background:#fff">' : '<div style="width:44px;height:44px;flex:none;border-radius:8px;background:rgba(255,255,255,.06)"></div>';
  }

  function origemBadge(o) { return o === 'indicado' ? '<span class="badge badge-blue">Indicado</span>' : '<span class="badge badge-orange">Fornecido</span>'; }

  function lojaDe(p) { return p.LINK_COMISSAO ? nomeLoja(p.LINK_COMISSAO) : ''; }
  function lojaHtml(p) { const l = lojaDe(p); return l ? '<div class="small">' + escHtml(l) + '</div>' : ''; }
  function botaoCompartilhar(p) {
    if (!p.LINK_COMISSAO) return '';
    return '<a class="btn btn-primary btn-sm" data-acao="comprar" href="' + escHtml(p.LINK_COMISSAO) + '" target="_blank" rel="noopener" style="text-decoration:none" title="Abrir no ' + escHtml(nomeLoja(p.LINK_COMISSAO) || 'site') + '">Comprar</a> ' +
      '<button class="btn btn-secondary btn-sm" data-acao="compartilhar" data-id="' + escHtml(p.ID_PRODUTO) + '" title="Compartilhar link com comissão">Compartilhar</button> ';
  }
  function compartilhar(id) {
    const p = CAT.lista.filter(function(x) { return x.ID_PRODUTO === id; })[0];
    if (!p || !p.LINK_COMISSAO) { toast('Este produto não tem link de comissão.', 'warn'); return; }
    abrirCompartilhar('Compartilhar produto', p.LINK_COMISSAO, '');
  }

  function renderLista() {
    const box = $id('cat-lista'); if (!box) return;
    const l = filtrados();
    if (!l.length) { box.innerHTML = '<div class="glass card empty">' + (CAT.lista.length ? 'Nenhum produto com esses filtros.' : 'Catálogo vazio. Use “+ Novo produto” para cadastrar o primeiro.') + '</div>'; return; }
    const linhas = l.map(function(p) {
      const ativo = ehAtivo(p);
      return '<tr class="' + (ativo ? '' : 'ghost') + '"><td><div style="display:flex;gap:10px;align-items:center">' + miniatura(p) + '<div><div class="row-title">' + escHtml(p.NOME) + '</div><div class="small">' + escHtml([p.MARCA, p.APP_CONTROLE].filter(Boolean).join(' · ')) + '</div></div></div></td>' +
        '<td>' + escHtml(p.CATEGORIA || '—') + (p.FORMATO_CAIXA ? ' <span class="badge">' + escHtml(p.FORMATO_CAIXA) + '</span>' : '') + '</td><td>' + origemBadge(p.ORIGEM) + lojaHtml(p) + '</td>' +
        '<td>' + fmtMoeda(p.PRECO_INSTALACAO) + '</td><td>' + fmtMoeda(p.PRECO_APARELHO) + avisoPreco(p) + '</td>' +
        '<td class="acoes">' + botaoCompartilhar(p) + '<button class="btn btn-secondary btn-sm" data-acao="editar" data-id="' + escHtml(p.ID_PRODUTO) + '">Editar</button> ' +
        '<button class="btn btn-ghost btn-sm" data-acao="' + (ativo ? 'desativar' : 'ativar') + '" data-id="' + escHtml(p.ID_PRODUTO) + '">' + (ativo ? 'Desativar' : 'Ativar') + '</button></td></tr>';
    }).join('');
    const cards = l.map(function(p) {
      return '<div class="glass item-card ' + (ehAtivo(p) ? '' : 'ghost') + '" data-acao="editar" data-id="' + escHtml(p.ID_PRODUTO) + '"><div style="display:flex;gap:10px;align-items:center">' + miniatura(p) + '<div class="row-title">' + escHtml(p.NOME) + '</div></div>' +
        '<div>' + origemBadge(p.ORIGEM) + (lojaDe(p) ? ' <span class="badge">' + escHtml(lojaDe(p)) + '</span>' : '') + ' <span class="small">' + escHtml(p.CATEGORIA || '') + '</span></div><div class="small">Instalação ' + fmtMoeda(p.PRECO_INSTALACAO) + '</div>' + (p.LINK_COMISSAO ? '<div style="margin-top:6px">' + botaoCompartilhar(p) + '</div>' : '') + '</div>';
    }).join('');
    box.innerHTML = '<div class="glass card table-wrap"><table class="table"><thead><tr><th>Produto</th><th>Categoria</th><th>Origem</th><th>Instalação</th><th>Aparelho</th><th></th></tr></thead><tbody>' + linhas + '</tbody></table></div><div class="lista-cards">' + cards + '</div>';
  }

  function abrirForm(id) {
    const p = id ? CAT.lista.filter(function(x) { return x.ID_PRODUTO === id; })[0] : null;
    if (id && !p) return;
    const v = function(k) { return escHtml(p ? p[k] : ''); };
    const n = function(k) { return p && p[k] !== '' && p[k] !== undefined ? escHtml(p[k]) : ''; };
    abrirModal(p ? 'Editar produto' : 'Novo produto',
      '<div class="form-grid">' +
        '<div class="form-group full"><label class="form-label required">Nome</label><input id="fp-nome" class="form-input" placeholder="Ex.: Interruptor touch 3 teclas" value="' + v('NOME') + '"></div>' +
        '<div class="form-group"><label class="form-label">Categoria</label><select id="fp-categoria" class="form-input">' + CATEGORIAS.map(function(x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
        '<div class="form-group"><label class="form-label">Marca</label><input id="fp-marca" class="form-input" value="' + v('MARCA') + '"></div>' +
        '<div class="form-group"><label class="form-label">App / ecossistema</label><input id="fp-app" class="form-input" placeholder="eWeLink, Smart Life..." value="' + v('APP_CONTROLE') + '"></div>' +
        '<div class="form-group"><label class="form-label">Formato da caixa</label><select id="fp-caixa" class="form-input">' + CAIXAS.map(function(x) { return '<option value="' + x + '">' + (x || '—') + '</option>'; }).join('') + '</select></div>' +
        '<div class="form-group"><label class="form-check"><input type="checkbox" id="fp-neutro"> Exige neutro</label></div>' +
        '<div class="form-group"><label class="form-check"><input type="checkbox" id="fp-alexa"> Compatível com Alexa</label></div>' +
        '<div class="form-group"><label class="form-label">Origem</label><select id="fp-origem" class="form-input"><option value="domotica">Fornecido por mim</option><option value="indicado">Indicado (cliente compra pelo meu link)</option></select></div>' +
        '<div class="form-group" id="fp-link-grupo"><label class="form-label">Link de comissão</label><input id="fp-link" class="form-input" placeholder="https://..." value="' + v('LINK_COMISSAO') + '"><div class="small" id="fp-loja"></div></div>' +
        '<div class="form-group"><label class="form-label">Preço de instalação (R$)</label><input id="fp-pinst" type="number" step="0.01" min="0" class="form-input" value="' + n('PRECO_INSTALACAO') + '"></div>' +
        '<div class="form-group"><label class="form-label">Preço do aparelho (R$)</label><input id="fp-papar" type="number" step="0.01" min="0" class="form-input" value="' + n('PRECO_APARELHO') + '"></div>' +
        '<div class="form-group"><label class="form-label">Custo (R$)</label><input id="fp-custo" type="number" step="0.01" min="0" class="form-input" value="' + n('CUSTO') + '"></div>' +
        '<div class="form-group"><label class="form-label">Link da imagem do produto</label><input id="fp-imagem" class="form-input" placeholder="https://..." value="' + v('IMAGEM_URL') + '"></div>' +
        '<div class="form-group full"><label class="form-label">3 benefícios curtos (aparecem no orçamento)</label><input id="fp-b1" class="form-input" style="margin-bottom:6px" value="' + v('BENEFICIO_1') + '"><input id="fp-b2" class="form-input" style="margin-bottom:6px" value="' + v('BENEFICIO_2') + '"><input id="fp-b3" class="form-input" value="' + v('BENEFICIO_3') + '"></div>' +
      '</div>',
      '<button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" id="fp-salvar">Salvar</button>', 'grande');
    $id('fp-categoria').value = p && p.CATEGORIA ? p.CATEGORIA : CATEGORIAS[0];
    $id('fp-caixa').value = p && p.FORMATO_CAIXA ? p.FORMATO_CAIXA : '';
    $id('fp-neutro').checked = !!(p && (p.EXIGE_NEUTRO === true || p.EXIGE_NEUTRO === 'TRUE'));
    $id('fp-alexa').checked = !!(p && (p.ALEXA === true || p.ALEXA === 'TRUE'));
    $id('fp-origem').value = p && p.ORIGEM ? p.ORIGEM : 'domotica';
    const ajustaLink = function() { $id('fp-link-grupo').style.display = $id('fp-origem').value === 'indicado' ? '' : 'none'; };
    $id('fp-origem').addEventListener('change', ajustaLink); ajustaLink();
    const mostraLoja = function() { const l = nomeLoja(inputVal('fp-link')); $id('fp-loja').textContent = l ? 'Site: ' + l : ''; };
    $id('fp-link').addEventListener('input', mostraLoja); mostraLoja();
    $id('fp-salvar').addEventListener('click', function() { salvar(id); });
    setTimeout(function() { const e = $id('fp-nome'); if (e) e.focus(); }, 50);
  }

  function salvar(id) {
    const dados = {
      ID_PRODUTO: id || '', NOME: inputVal('fp-nome'), CATEGORIA: $id('fp-categoria').value, MARCA: inputVal('fp-marca'), APP_CONTROLE: inputVal('fp-app'),
      FORMATO_CAIXA: $id('fp-caixa').value, EXIGE_NEUTRO: checkVal('fp-neutro'), ALEXA: checkVal('fp-alexa'), ORIGEM: $id('fp-origem').value,
      LINK_COMISSAO: inputVal('fp-link'), PRECO_INSTALACAO: inputVal('fp-pinst'), PRECO_APARELHO: inputVal('fp-papar'), CUSTO: inputVal('fp-custo'),
      IMAGEM_URL: inputVal('fp-imagem'), BENEFICIO_1: inputVal('fp-b1'), BENEFICIO_2: inputVal('fp-b2'), BENEFICIO_3: inputVal('fp-b3'),
    };
    if (!dados.NOME) { toast('Informe o nome do produto.', 'warn'); return; }
    const btn = $id('fp-salvar'); btn.disabled = true;
    chamarBackend('salvarProduto', [APP.token, dados], function(reg) {
      const i = CAT.lista.findIndex(function(x) { return x.ID_PRODUTO === reg.ID_PRODUTO; });
      if (i > -1) CAT.lista[i] = reg; else CAT.lista.push(reg);
      CAT.lista.sort(function(a, b) { return String(a.NOME).localeCompare(String(b.NOME), 'pt-BR'); });
      fecharModal(); renderLista(); toast(id ? 'Produto atualizado.' : 'Produto cadastrado.');
    }, function(err) { btn.disabled = false; toast(err, 'error'); });
  }

  function alternarAtivo(id, ativo) {
    chamarBackend('alternarProdutoAtivo', [APP.token, id, ativo], function(reg) {
      const i = CAT.lista.findIndex(function(x) { return x.ID_PRODUTO === id; });
      if (i > -1) CAT.lista[i] = reg;
      renderLista(); toast(ativo ? 'Produto ativado.' : 'Produto desativado.');
    });
  }
})();
</script>

<script>
// Importação de produtos: lê a lista do Mercado Livre direto pelo link (ou um arquivo .json, usado para a Shopee).
// Mostra uma prévia editável; só grava quando o usuário confirma.
(function() {
  const CATEGORIAS = ['Interruptor', 'Tomada', 'Iluminação', 'Sensor', 'Câmera', 'Fechadura', 'Assistente de voz', 'Som ambiente', 'Persiana / cortina', 'Climatização', 'Portão', 'Rede / Wi-Fi', 'Outros'];
  const CAIXAS = ['', '4x2', '4x4', 'Embutir', 'Sobrepor', 'Outro'];
  let LINHAS = [];

  function sugerir(it) {
    const t = norm((it.titulo || '') + ' ' + (it.marca || ''));
    let cat = 'Outros';
    if (/interruptor|nspanel|dimmer/.test(t)) cat = 'Interruptor';
    else if (/tomada/.test(t)) cat = 'Tomada';
    else if (/sensor/.test(t)) cat = 'Sensor';
    else if (/camera/.test(t)) cat = 'Câmera';
    else if (/fechadura/.test(t)) cat = 'Fechadura';
    else if (/echo|alexa/.test(t) && !/suporte/.test(t)) cat = 'Assistente de voz';
    let app = '';
    if (/tuya|smart life/.test(t)) app = 'Smart Life / Tuya';
    else if (/ewelink|sonoff/.test(t)) app = 'eWeLink';
    else if (/echo|alexa/.test(t) && cat === 'Assistente de voz') app = 'Alexa';
    return { cat: cat, caixa: /4x2/.test(t) ? '4x2' : (/embutir/.test(t) ? 'Embutir' : ''), app: app, alexa: /alexa|echo/.test(t) };
  }

  function opts(lista, atual) { return lista.map(function(x) { return '<option value="' + escHtml(x) + '"' + (x === atual ? ' selected' : '') + '>' + escHtml(x || '—') + '</option>'; }).join(''); }

  function linhasDe(dados) {
    return dados.slice(0, 200).map(function(it) {
      const s = sugerir(it), util = it.categoria_sugerida === 'dispositivo' || it.categoria_sugerida === 'acessorio';
      return { it: it, existe: !!it.existe, marcado: util && !it.existe, cat: s.cat, caixa: s.caixa, app: s.app, alexa: s.alexa, neutro: false, preco: it.preco_aparelho };
    });
  }

  window.abrirImportacaoCatalogo = function(aoConcluir) {
    abrirModal('Importar produtos',
      '<div class="form-group"><label class="form-label">Link da lista do Mercado Livre</label>' +
        '<div style="display:flex;gap:8px"><input id="imp-url" class="form-input grow" placeholder="https://meli.la/... ou link da lista"><button class="btn btn-primary" id="imp-ler">Ler lista</button></div>' +
        '<div class="small" style="margin-top:6px">Lê os produtos direto do link e mostra só o que ainda não está no catálogo marcado para importar.</div></div>' +
      '<div class="form-group"><label class="form-label">Ou um arquivo .json (Shopee)</label><input type="file" id="imp-arquivo" accept=".json,application/json" class="form-input"></div>' +
      '<div class="form-group"><label class="form-label">Ou cole os dados (JSON)</label><textarea id="imp-colar" class="form-input" rows="3" placeholder="[{...}]"></textarea><button class="btn btn-secondary btn-sm" id="imp-usar-colado" style="margin-top:6px">Usar dados colados</button></div>' +
      '<div id="imp-previa" style="margin-top:14px"></div>',
      '<button class="btn btn-secondary" onclick="fecharModal()">Cancelar</button><button class="btn btn-primary" id="imp-gravar" disabled>Importar selecionados</button>', 'grande');

    chamarBackend('obterListaSalva', [APP.token], function(u) { if (u && $id('imp-url')) $id('imp-url').value = u; });

    $id('imp-ler').addEventListener('click', function() {
      const url = inputVal('imp-url'); if (!url) { toast('Cole o link da lista.', 'warn'); return; }
      const b = $id('imp-ler'); b.disabled = true; b.textContent = 'Lendo...';
      chamarBackend('lerListaMercadoLivre', [APP.token, url], function(res) {
        b.disabled = false; b.textContent = 'Ler lista';
        LINHAS = linhasDe(res.itens); previa();
      }, function(err) { b.disabled = false; b.textContent = 'Ler lista'; toast(err, 'error', 8000); });
    });
    $id('imp-arquivo').addEventListener('change', function(e) {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = function() {
        let dados;
        try { dados = JSON.parse(r.result); } catch (err) { toast('Arquivo inválido: não é um JSON.', 'error'); return; }
        if (!Array.isArray(dados) || !dados.length) { toast('O arquivo não tem produtos.', 'error'); return; }
        LINHAS = linhasDe(dados); previa();
      };
      r.readAsText(f, 'utf-8');
    });
    $id('imp-usar-colado').addEventListener('click', function() {
      let dados;
      try { dados = JSON.parse(inputVal('imp-colar')); } catch (err) { toast('Os dados colados não são um JSON válido.', 'error'); return; }
      if (!Array.isArray(dados) || !dados.length) { toast('Não há produtos nos dados colados.', 'error'); return; }
      LINHAS = linhasDe(dados); previa();
    });
    $id('imp-gravar').addEventListener('click', function() { gravar(aoConcluir); });
  };

  function previa() {
    const linhas = LINHAS.map(function(l, i) {
      const alerta = l.it.alerta ? '<div class="small" style="color:#b45309">⚠ ' + escHtml(l.it.alerta) + '</div>' : '';
      const dis = l.existe ? ' disabled' : '';
      const img = l.it.imagem ? '<img src="' + escHtml(l.it.imagem) + '" alt="" referrerpolicy="no-referrer" loading="lazy" style="width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff">' : '';
      return '<tr class="' + (l.marcado ? '' : 'ghost') + '"><td><input type="checkbox" data-i="' + i + '" data-c="marcado"' + (l.marcado ? ' checked' : '') + dis + '></td><td>' + img + '</td>' +
        '<td><div class="row-title">' + escHtml(l.it.titulo) + '</div><div class="small">' + escHtml([l.it.marca, l.it.loja].filter(Boolean).join(' · ')) + (l.existe ? ' · <b>já no catálogo</b>' : '') + '</div>' + alerta + '</td>' +
        '<td><select class="form-input" data-i="' + i + '" data-c="cat">' + opts(CATEGORIAS, l.cat) + '</select></td>' +
        '<td><select class="form-input" data-i="' + i + '" data-c="caixa">' + opts(CAIXAS, l.caixa) + '</select></td>' +
        '<td><input type="checkbox" data-i="' + i + '" data-c="neutro"' + (l.neutro ? ' checked' : '') + '></td>' +
        '<td><input type="checkbox" data-i="' + i + '" data-c="alexa"' + (l.alexa ? ' checked' : '') + '></td>' +
        '<td><input type="number" step="0.01" min="0" class="form-input" style="width:100px" data-i="' + i + '" data-c="preco" value="' + escHtml(l.preco === undefined ? '' : l.preco) + '"></td></tr>';
    }).join('');
    const box = _recriarEl('imp-previa');
    box.innerHTML = '<div class="small" id="imp-contagem"></div><div class="table-wrap" style="max-height:50vh;overflow:auto"><table class="table"><thead><tr><th></th><th></th><th>Produto</th><th>Categoria</th><th>Caixa</th><th>Neutro</th><th>Alexa</th><th>Aparelho (R$)</th></tr></thead><tbody>' + linhas + '</tbody></table></div>';
    box.addEventListener('change', function(e) {
      const el = e.target, i = el.getAttribute('data-i'), c = el.getAttribute('data-c'); if (i === null) return;
      LINHAS[i][c] = el.type === 'checkbox' ? el.checked : el.value;
      if (c === 'marcado') el.closest('tr').classList.toggle('ghost', !el.checked);
      contar();
    });
    contar();
  }

  function contar() {
    const n = LINHAS.filter(function(l) { return l.marcado; }).length, ja = LINHAS.filter(function(l) { return l.existe; }).length;
    $id('imp-contagem').textContent = n + ' selecionados de ' + LINHAS.length + (ja ? ' (' + ja + ' já estão no catálogo).' : '.') + ' Preço de instalação e benefícios ficam para editar depois.';
    $id('imp-gravar').disabled = n === 0;
  }

  function gravar(aoConcluir) {
    const itens = LINHAS.filter(function(l) { return l.marcado && !l.existe; }).map(function(l) {
      return { NOME: l.it.titulo, MARCA: l.it.marca === '(sem marca)' || l.it.marca === '(ver)' ? '' : l.it.marca, CATEGORIA: l.cat, FORMATO_CAIXA: l.caixa, APP_CONTROLE: l.app,
        EXIGE_NEUTRO: l.neutro, ALEXA: l.alexa, PRECO_APARELHO: l.preco, LINK_COMISSAO: l.it.link, IMAGEM_URL: l.it.imagem };
    });
    const btn = $id('imp-gravar'); btn.disabled = true; btn.textContent = 'Importando...';
    chamarBackend('importarProdutos', [APP.token, itens], function(res) {
      fecharModal();
      toast(res.criados + ' produto(s) importado(s)' + (res.ignorados.length ? ', ' + res.ignorados.length + ' ignorado(s).' : '.'), 'success', 6000);
      if (aoConcluir) aoConcluir();
    }, function(err) { btn.disabled = false; btn.textContent = 'Importar selecionados'; toast(err, 'error'); });
  }
})();
</script>

<script>
(function() {
  // Dispositivos instalados ainda não têm lista; por enquanto a tela traz o simulador da regra de garantia.
  let linhas = [];

  VIEWS.dispositivos = {
    titulo: 'Dispositivos e garantia',
    render: function(c) {
      linhas = [{ qtd: 1, origem: 'domotica' }, { qtd: 1, origem: 'domotica' }, { qtd: 1, origem: 'cliente' }];
      c.innerHTML =
        '<div class="glass card">' +
          '<h3 style="margin-bottom:4px">Simulador de garantia</h3>' +
          '<p class="muted" style="margin:0 0 14px">Monte um projeto e veja o prazo. É a mesma regra que o orçamento vai usar.</p>' +
          '<div id="sim-linhas"></div>' +
          '<div style="display:flex;gap:10px;margin-top:6px"><button class="btn btn-secondary btn-sm" data-acao="add">+ Adicionar item</button><button class="btn btn-primary btn-sm" data-acao="calcular">Calcular</button></div>' +
          '<div id="sim-resultado"></div>' +
        '</div>' +
        '<p class="small" style="margin-top:14px">Regra: 70% ou mais dos aparelhos fornecidos ou indicados por você (ou reinstalados com retirada feita por você e menos de 1 ano): 4 meses em projeto pequeno (menos de 5 aparelhos) e 6 meses em projeto grande. Abaixo disso: 3 meses.</p>';
      desenhar();
      c.addEventListener('click', function(e) {
        const el = e.target.closest('[data-acao]'); if (!el) return;
        const a = el.getAttribute('data-acao');
        if (a === 'add') { ler(); linhas.push({ qtd: 1, origem: 'domotica' }); desenhar(); }
        else if (a === 'rem') { ler(); linhas.splice(Number(el.getAttribute('data-i')), 1); desenhar(); }
        else if (a === 'calcular') calcular();
      });
      c.addEventListener('change', function(e) { if (e.target.matches('[data-campo="origem"]')) { ler(); desenhar(); } });
    },
  };

  function desenhar() {
    $id('sim-linhas').innerHTML = linhas.map(function(l, i) {
      const reinst = l.origem === 'reinstalacao';
      return '<div class="linha-sim">' +
        '<div class="form-group" style="margin:0"><label class="form-label">Qtd</label><input class="form-input" type="number" min="1" data-campo="qtd" data-i="' + i + '" value="' + l.qtd + '"></div>' +
        '<div class="form-group" style="margin:0"><label class="form-label">Origem</label><select class="form-input" data-campo="origem" data-i="' + i + '">' +
          [['domotica', 'Fornecido por mim'], ['indicado', 'Indicado (link)'], ['cliente', 'Cliente comprou / já tinha'], ['reinstalacao', 'Reinstalação (mudança)']].map(function(o) { return '<option value="' + o[0] + '"' + (l.origem === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') +
        '</select></div>' +
        '<div style="margin:0">' + (reinst ? '<div class="form-group" style="margin:0"><label class="form-label">Instalado em</label><input class="form-input" type="date" data-campo="data" data-i="' + i + '" value="' + (l.data || '') + '"></div><label class="form-check" style="margin-top:6px"><input type="checkbox" data-campo="retirou" data-i="' + i + '"' + (l.retirou ? ' checked' : '') + '> Retirei eu</label>' : '') + '</div>' +
        '<button class="btn btn-ghost btn-sm" data-acao="rem" data-i="' + i + '" aria-label="Remover">✕</button></div>';
    }).join('');
  }

  function ler() {
    document.querySelectorAll('#sim-linhas [data-campo]').forEach(function(el) {
      const i = Number(el.getAttribute('data-i')); const campo = el.getAttribute('data-campo'); if (!linhas[i]) return;
      if (campo === 'qtd') linhas[i].qtd = Number(el.value) || 1;
      else if (campo === 'origem') linhas[i].origem = el.value;
      else if (campo === 'data') linhas[i].data = el.value;
      else if (campo === 'retirou') linhas[i].retirou = el.checked;
    });
  }

  function calcular() {
    ler();
    if (!linhas.length) { toast('Adicione ao menos um item.', 'warn'); return; }
    const itens = linhas.map(function(l) {
      return l.origem === 'reinstalacao'
        ? { qtd: l.qtd, origem: 'cliente', reinstalacao: true, dataInstalacaoAnterior: l.data || '', retiradaPelaDomotica: !!l.retirou }
        : { qtd: l.qtd, origem: l.origem };
    });
    chamarBackend('calcularGarantiaProjeto', [APP.token, itens], function(r) {
      $id('sim-resultado').innerHTML =
        '<div class="glass resultado"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">' +
          '<div><div class="meses">' + r.meses + '</div><div class="muted">meses de garantia</div></div>' +
          '<div><div><b>' + r.total + '</b> aparelhos · projeto <b>' + (r.grande ? 'grande' : 'pequeno') + '</b></div>' +
          '<div><b>' + r.pct + '%</b> da Domótica (' + r.daDomotica + ' de ' + r.total + ')</div>' +
          '<div class="muted">' + (r.estendida ? 'Garantia estendida (70% ou mais).' : 'Abaixo de 70%: garantia padrão.') + '</div></div></div>' +
          '<ul class="small" style="margin:12px 0 0;padding-left:18px">' + r.detalhes.map(function(d) { return '<li>' + d.qtd + '× ' + escHtml(d.motivo) + (d.conta ? ' (conta)' : ' (não conta)') + '</li>'; }).join('') + '</ul></div>';
    });
  }
})();
</script>

<script>
(function() {
  const COD = { lista: [], clientes: [], timer: null };
  const CHAVE_URL = 'DOM_COD_URL';
  function guardado() { try { return localStorage.getItem(CHAVE_URL) || ''; } catch (e) { return ''; } }
  function guardar(v) { try { localStorage.setItem(CHAVE_URL, v); } catch (e) {} }

  VIEWS.codigos = {
    titulo: 'Códigos de ativação',
    render: function(c) {
      $id('topbar-actions').innerHTML = '<button class="btn btn-secondary" data-acao="atualizar">Atualizar</button>';
      c.innerHTML =
        '<div class="glass card" style="padding:16px;margin-bottom:14px">' +
          '<div class="row-title">Link para o cliente liberar a leitura dos códigos</div>' +
          '<div class="small" style="margin:4px 0 10px">O cliente abre o link, clica em “Autorizar e ativar” e, por 14 dias, os códigos de ativação dos apps de automação aparecem aqui.</div>' +
          '<div class="toolbar"><select id="cod-cliente" class="form-input"><option value="">Escolha o cliente...</option></select>' +
          '<input id="cod-url" class="form-input grow" placeholder="Endereço do app de autorização (Apps Script do cliente)" value="' + escHtml(guardado()) + '">' +
          '<button class="btn btn-primary" data-acao="copiar">Copiar link</button></div>' +
        '</div>' +
        '<div id="cod-lista"><div class="glass card empty">Carregando...</div></div>';
      const acao = function(e) {
        const el = e.target.closest('[data-acao]'); if (!el) return;
        const a = el.getAttribute('data-acao');
        if (a === 'atualizar') carregar(true);
        else if (a === 'copiar') copiarLink();
        else if (a === 'copiar-codigo') copiarTexto(el.getAttribute('data-codigo'));
      };
      c.addEventListener('click', acao); $id('topbar-actions').addEventListener('click', acao);
      chamarBackend('listarClientes', [APP.token], function(l) {
        COD.clientes = l.filter(function(x) { return (x.STATUS || 'ativo') === 'ativo'; });
        const s = $id('cod-cliente'); if (!s) return;
        s.innerHTML = '<option value="">Escolha o cliente...</option>' + COD.clientes.map(function(x) { return '<option value="' + escHtml(x.ID_CLIENTE) + '">' + escHtml(x.NOME) + '</option>'; }).join('');
      });
      carregar();
      clearInterval(COD.timer);
      COD.timer = setInterval(function() { if (!$id('cod-lista') || APP.view !== 'codigos') { clearInterval(COD.timer); return; } carregar(); }, 20000);
    },
  };

  function copiarLink() {
    const id = $id('cod-cliente').value, base = inputVal('cod-url');
    if (!id) { toast('Escolha o cliente.', 'warn'); return; }
    if (!/^https:\/\//i.test(base)) { toast('Cole o endereço do app de autorização (começa com https://).', 'warn'); return; }
    guardar(base);
    copiarTexto(base + (base.indexOf('?') < 0 ? '?' : '&') + 'cliente=' + encodeURIComponent(id));
  }

  function carregar(aviso) {
    chamarBackend('listarCodigos', [APP.token], function(l) {
      COD.lista = l; pintar(); if (aviso) toast('Lista atualizada.', 'info', 1500);
    });
  }

  function pintar() {
    const box = $id('cod-lista'); if (!box) return;
    if (!COD.lista.length) { box.innerHTML = '<div class="glass card empty">Nenhum código recebido ainda.</div>'; return; }
    box.innerHTML = COD.lista.map(function(c) {
      const links = (c.links || []).map(function(u) { return '<div class="small"><a href="' + escHtml(u) + '" target="_blank" rel="noopener">' + escHtml(String(u).slice(0, 70)) + '</a></div>'; }).join('');
      return '<div class="glass item-card" style="margin-bottom:10px"><div style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap">' +
        '<div><div class="row-title">' + escHtml(c.cliente || '—') + '</div><div class="small">' + escHtml(c.remetente) + ' · ' + escHtml(c.assunto) + '</div><div class="small">' + escHtml(c.quando) + '</div>' + links + '</div>' +
        (c.codigo ? '<div style="display:flex;gap:10px;align-items:center"><span style="font-size:26px;font-weight:700;letter-spacing:3px">' + escHtml(c.codigo) + '</span><button class="btn btn-secondary btn-sm" data-acao="copiar-codigo" data-codigo="' + escHtml(c.codigo) + '">Copiar</button></div>' : '') +
        '</div></div>';
    }).join('');
  }
})();
</script>

<script>
// Plantas e projetos: subir a planta, marcar pontos/fios/anotações e marcar cada execução como feita.
(function() {
  const CATEGORIAS = [
    { id: 'interruptor_1', nome: 'Interruptor 1 tecla', sigla: '1' }, { id: 'interruptor_2', nome: 'Interruptor 2 teclas', sigla: '2' },
