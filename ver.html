<script>// Página que o cliente abre pelo link: só visualização (2D e 3D) + aprovar ou pedir alterações.
(function() {
  document.documentElement.classList.add('ro');
  var CFG = window.DOMOTICA_CFG;
  var PORTAL = /^#p=/.test(location.hash);
  var sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: PORTAL, autoRefreshToken: PORTAL, detectSessionInUrl: false } });
  var token = (location.hash || '').replace(/^#/, '').trim(), PID = PORTAL ? token.slice(2) : '';
  var D = null;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function dia(x) { return new Date(x).toLocaleDateString('pt-BR'); }
  function tela(msg) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;padding:24px;text-align:center';
    d.innerHTML = '<div><div style="font-size:20px;font-weight:700;color:#ff7a00;margin-bottom:10px">Domótica Automação Residencial</div><div style="font-size:16px;line-height:1.5;max-width:420px">' + esc(msg) + '</div></div>';
    document.body.appendChild(d);
  }
  function dialogo(titulo, corpo, ok) {
    return new Promise(function(res) {
      var o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
      o.innerHTML = '<div style="background:#16202f;color:#fff;border-radius:14px;padding:18px;max-width:440px;width:100%;font-family:system-ui,sans-serif"><h3 style="margin:0 0 10px">' + esc(titulo) + '</h3>' + corpo +
        '<div style="display:flex;gap:8px;margin-top:14px"><button data-n style="flex:1;padding:10px;border-radius:10px;border:1px solid #475569;background:transparent;color:#fff">Cancelar</button><button data-o style="flex:1;padding:10px;border-radius:10px;border:0;background:#ff7a00;color:#1a1000;font-weight:700">' + esc(ok) + '</button></div></div>';
      document.body.appendChild(o);
      function fim(v) { o.remove(); res(v); }
      o.querySelector('[data-n]').onclick = function() { fim(null); };
      o.querySelector('[data-o]').onclick = function() { var n = o.querySelector('[data-nome]'), c = o.querySelector('[data-com]'); fim({ nome: n ? n.value : '', com: c ? c.value : '' }); };
    });
  }
  var CAMPO = 'width:100%;box-sizing:border-box;padding:9px;border-radius:9px;border:1px solid #475569;background:#0b1220;color:#fff;margin-top:4px;font:inherit';
  function pintaStatus() {
    var el = document.getElementById('v-status'); if (!el) return;
    var ultima = (D.respostas || []).slice(-1)[0];
    el.textContent = D.status === 'aprovada' ? '✓ Você aprovou este projeto' + (ultima ? ' em ' + dia(ultima.em) : '') : D.status === 'alteracoes' ? '✎ Pedido de alterações enviado' : (PORTAL ? '' : 'Link válido até ' + dia(D.expira_em));
  }
  async function responder(acao) {
    var corpo = '<label style="font-size:13px">Seu nome<input data-nome style="' + CAMPO + '" maxlength="80"></label>' +
      (acao === 'alteracoes' ? '<label style="font-size:13px;display:block;margin-top:10px">O que você quer mudar?<textarea data-com rows="4" style="' + CAMPO + '" maxlength="2000" placeholder="Ex.: mover o ponto de luz da sala, incluir tomada na varanda…"></textarea></label>' : '<label style="font-size:13px;display:block;margin-top:10px">Comentário (opcional)<textarea data-com rows="2" style="' + CAMPO + '" maxlength="2000"></textarea></label>');
    var r = await dialogo(acao === 'aprovada' ? 'Aprovar projeto' : 'Solicitar alterações', corpo, acao === 'aprovada' ? 'Aprovar' : 'Enviar pedido');
    if (!r) return;
    var x = PORTAL ? await sb.rpc('portal_responder', { p_tipo: 'projeto', p_id: PID, p_acao: acao === 'aprovada' ? 'aprovado' : 'alteracoes', p_comentario: r.com }) : await sb.rpc('share_responder', { p_token: token, p_acao: acao, p_nome: r.nome, p_comentario: r.com });
    if (x.error) { alert(x.error.message || 'Não foi possível enviar.'); return; }
    D.status = acao; D.respostas = (D.respostas || []).concat([{ acao: acao, nome: r.nome, em: new Date().toISOString() }]); pintaStatus();
    alert(acao === 'aprovada' ? 'Projeto aprovado. Obrigado!' : 'Pedido enviado. A Domótica vai analisar e retornar.');
  }
  window.addEventListener('load', async function() {
    if (!token) return tela('Link inválido.');
    var r = PORTAL ? await sb.rpc('portal_projeto', { p_id: PID }) : await sb.rpc('share_get', { p_token: token });
    var d = r.data; if (PORTAL && d && !d.erro) { d.empresa = 'Domótica'; d.status = ''; d.respostas = []; }
    if (r.error || !d || d.erro) return tela(d && d.erro === 'expirado' ? 'Este link expirou. Peça um novo à Domótica.' : 'Este link não está disponível.');
    D = d; document.title = (d.nome || 'Planta') + ' · ' + (d.empresa || 'Domótica');
    window.Planta.carregar(d.planta, null);
    var topo = document.getElementById('top'), info = document.createElement('div');
    info.style.cssText = 'display:flex;flex-direction:column;line-height:1.25;font-size:13px';

    topo.appendChild(info); pintaStatus();

    barra.onclick = function(e) { var b = e.target.closest('button'); if (b) responder(b.dataset.a); };
    document.body.appendChild(barra);
    setTimeout(function() { document.getElementById('zFit').click(); }, 150);
  });
})();

<script>
/* Planta_geo.js — núcleo de geometria (roda no navegador e no Node).
 * Coordenadas em unidades livres; depois da calibração, 1 unidade = 1 cm. */
(function (root) {
  'use strict';
  const G = {};
  const D2R = Math.PI / 180;
  const len = s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1);

  /* ---------- projeção ponto → segmento ---------- */
  function projT(s, px, py) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L2 = dx * dx + dy * dy || 1e-9;
    const raw = ((px - s.x1) * dx + (py - s.y1) * dy) / L2;
    const tc = Math.max(0, Math.min(1, raw));
    const x = s.x1 + dx * tc, y = s.y1 + dy * tc;
    return { t: raw, tc, x, y, d: Math.hypot(px - x, py - y) };
  }
  G.projT = projT;

  /* ---------- Ramer–Douglas–Peucker (rabisco → poucos pontos) ---------- */
  G.simplificar = function (pts, eps) {
    if (pts.length < 3) return pts.slice();
    const a = pts[0], b = pts[pts.length - 1];
    let mx = -1, mi = -1;
    for (let i = 1; i < pts.length - 1; i++) {
      const d = projT({ x1: a.x, y1: a.y, x2: b.x, y2: b.y }, pts[i].x, pts[i].y).d;
      if (d > mx) { mx = d; mi = i; }
    }
    if (mx <= eps) return [a, b];
    const l = G.simplificar(pts.slice(0, mi + 1), eps);
    const r = G.simplificar(pts.slice(mi), eps);
    return l.slice(0, -1).concat(r);
  };

  G.tracoParaSegs = function (pts, eps) {
    const p = G.simplificar(pts, eps), out = [];
    for (let i = 0; i < p.length - 1; i++) out.push({ x1: p[i].x, y1: p[i].y, x2: p[i + 1].x, y2: p[i + 1].y });
    return out;
  };

  /* ---------- ângulo dominante (corrige foto/esboço torto) ---------- */
  G.anguloDominante = function (S) {
    let c = 0, s = 0;
    S.forEach(g => { const L = len(g), a = Math.atan2(g.y2 - g.y1, g.x2 - g.x1); c += L * Math.cos(4 * a); s += L * Math.sin(4 * a); });
    return Math.atan2(s, c) / 4 / D2R;
  };

  function agrupar(arr, key, tol) {
    const a = arr.slice().sort((p, q) => key(p) - key(q)), out = []; let cur = [];
    a.forEach(it => {
      if (cur.length && key(it) - key(cur[cur.length - 1]) > tol) { out.push(cur); cur = []; }
      cur.push(it);
    });
    if (cur.length) out.push(cur);
    return out;
  }

  /* ---------- ENDIREITAR: traços tortos → paredes retas e conectadas ---------- */
  G.endireitar = function (segs, opt) {
    opt = Object.assign({ tolAngulo: 20, tolCluster: null, gap: null, minLen: null, corrigirRotacao: true }, opt || {});
    let S = segs.map(s => ({ x1: +s.x1, y1: +s.y1, x2: +s.x2, y2: +s.y2 })).filter(s => len(s) > 0);
    if (!S.length) return { segs: [], rotacao: 0 };
    let rot = 0, centro = { x: 0, y: 0 };
    if (opt.corrigirRotacao) {
      rot = G.anguloDominante(S);
      if (Math.abs(rot) > 0.4) {
        let cx = 0, cy = 0; S.forEach(s => { cx += s.x1 + s.x2; cy += s.y1 + s.y2; }); cx /= 2 * S.length; cy /= 2 * S.length;
        centro = { x: cx, y: cy };
        const c = Math.cos(-rot * D2R), sn = Math.sin(-rot * D2R);
        const R = (x, y) => [cx + (x - cx) * c - (y - cy) * sn, cy + (x - cx) * sn + (y - cy) * c];
        S = S.map(s => { const a = R(s.x1, s.y1), b = R(s.x2, s.y2); return { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }; });
      } else rot = 0;
    }
    let minx = 1e18, maxx = -1e18, miny = 1e18, maxy = -1e18;
    S.forEach(s => { minx = Math.min(minx, s.x1, s.x2); maxx = Math.max(maxx, s.x1, s.x2); miny = Math.min(miny, s.y1, s.y2); maxy = Math.max(maxy, s.y1, s.y2); });
    const D = Math.max(maxx - minx, maxy - miny) || 1;
    const tol = opt.tolCluster != null ? opt.tolCluster : D * 0.025;
    const gap = opt.gap != null ? opt.gap : D * 0.04;
    const minLen = opt.minLen != null ? opt.minLen : D * 0.03;

    // 1) classificar H / V / diagonal
    let H = [], V = [], Dg = [];
    S.forEach(s => {
      const dx = Math.abs(s.x2 - s.x1), dy = Math.abs(s.y2 - s.y1), ang = Math.atan2(dy, dx) / D2R, L = len(s);
      if (ang <= opt.tolAngulo) H.push({ c: (s.y1 + s.y2) / 2, a: Math.min(s.x1, s.x2), b: Math.max(s.x1, s.x2), L });
      else if (ang >= 90 - opt.tolAngulo) V.push({ c: (s.x1 + s.x2) / 2, a: Math.min(s.y1, s.y2), b: Math.max(s.y1, s.y2), L });
      else Dg.push(s);
    });

    // 2) agrupar linhas paralelas próximas e fundir trechos alinhados
    const fundir = arr => {
      const out = [];
      agrupar(arr, o => o.c, tol).forEach(g => {
        let sw = 0, sc = 0; g.forEach(o => { sw += o.L; sc += o.c * o.L; });
        const c = sc / sw;
        g.sort((p, q) => p.a - q.a);
        let cur = null;
        g.forEach(o => {
          if (cur && o.a <= cur.b + gap) cur.b = Math.max(cur.b, o.b);
          else { if (cur) out.push(cur); cur = { c, a: o.a, b: o.b }; }
        });
        if (cur) out.push(cur);
      });
      return out;
    };
    H = fundir(H); V = fundir(V);

    // 3) estender/encurtar pontas até a parede perpendicular (cantos e T)
    const ajustar = (A, B) => {
      A.forEach(w => {
        ['a', 'b'].forEach(k => {
          let best = null;
          B.forEach(o => {
            if (w.c < o.a - gap || w.c > o.b + gap) return;
            const d = Math.abs(o.c - w[k]);
            if (d <= gap && (!best || d < best.d)) best = { d, c: o.c };
          });
          if (best) w[k] = best.c;
        });
      });
    };
    const H0 = H.map(o => ({ c: o.c, a: o.a, b: o.b })), V0 = V.map(o => ({ c: o.c, a: o.a, b: o.b }));
    ajustar(H, V0); ajustar(V, H0);

    let out = [];
    H.forEach(o => { if (o.b - o.a >= minLen) out.push({ x1: o.a, y1: o.c, x2: o.b, y2: o.c }); });
    V.forEach(o => { if (o.b - o.a >= minLen) out.push({ x1: o.c, y1: o.a, x2: o.c, y2: o.b }); });

    // 4) diagonais: soldar pontas em vértices próximos
    const pts = []; out.forEach(s => { pts.push([s.x1, s.y1], [s.x2, s.y2]); });
    Dg.forEach(s => {
      if (len(s) < minLen) return;
      const w = (x, y) => { let b = null; pts.forEach(p => { const d = Math.hypot(p[0] - x, p[1] - y); if (d <= gap && (!b || d < b.d)) b = { d, p }; }); return b ? b.p : [x, y]; };
      const a = w(s.x1, s.y1), b = w(s.x2, s.y2);
      out.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }); pts.push(a, b);
    });
    return { segs: out, rotacao: rot, centro: centro };
  };

  /* gira ponto pelo mesmo giro aplicado por endireitar (rot em graus, sentido -rot) */
  G.girar = function (x, y, rot, c) {
    if (!rot) return [x, y];
    const co = Math.cos(-rot * D2R), sn = Math.sin(-rot * D2R);
    return [c.x + (x - c.x) * co - (y - c.y) * sn, c.y + (x - c.x) * sn + (y - c.y) * co];
  };

  /* "3,50" / "3.5m" / "350" / "350cm" → cm (ou null) */
  G.parseCota = function (t) {
    if (t == null) return null;
    const s = String(t).toLowerCase().replace(',', '.');
    const m = s.match(/(\d+(?:\.\d+)?)/); if (!m) return null;
    const n = parseFloat(m[1]);
    if (/cm/.test(s)) return n;
    if (/mm/.test(s)) return n / 10;
    if (/m/.test(s)) return n * 100;
    return n >= 20 ? n : n * 100; // "3,5" = metros; "350" = cm
  };

  /* ---------- homografia (retificar foto): retângulo de saída → 4 cantos na foto ---------- */
  function resolver(A, b) {
    const n = b.length; const M = A.map((r, i) => r.concat([b[i]]));
    for (let i = 0; i < n; i++) {
      let p = i; for (let r = i + 1; r < n; r++) if (Math.abs(M[r][i]) > Math.abs(M[p][i])) p = r;
      [M[i], M[p]] = [M[p], M[i]];
      for (let r = i + 1; r < n; r++) { const f = M[r][i] / M[i][i]; for (let c = i; c <= n; c++) M[r][c] -= f * M[i][c]; }
    }
    const x = new Array(n);
    for (let i = n - 1; i >= 0; i--) { let s = M[i][n]; for (let c = i + 1; c < n; c++) s -= M[i][c] * x[c]; x[i] = s / M[i][i]; }
    return x;
  }
  /* src = [[x,y] TL, TR, BR, BL] na foto; devolve H (9) que leva (u,v) de saída → foto */
  G.homografia = function (src, w, h) {
    const dst = [[0, 0], [w, 0], [w, h], [0, h]], A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const u = dst[i][0], v = dst[i][1], x = src[i][0], y = src[i][1];
      A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); b.push(x);
      A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); b.push(y);
    }
    const s = resolver(A, b); return s.concat([1]);
  };
  G.aplicarH = function (H, u, v) { const d = H[6] * u + H[7] * v + H[8]; return [(H[0] * u + H[1] * v + H[2]) / d, (H[3] * u + H[4] * v + H[5]) / d]; };

  /* ---------- IMPORTAR leitura da foto (coords 0-1000) → planta em cm ---------- */
  G.importar = function (raw, W, H, opt) {
    opt = Object.assign({ grade: 5, esp: 15, colarMax: 60, larguraPadraoM: 12 }, opt || {});
    const px = (x, y) => [x * W / 1000, y * H / 1000];
    // 1) escala (cm por pixel) pelas cotas escritas; senão chute marcado como não calibrado
    const fs = [];
    (raw.cotas || []).forEach(c => {
      const cm = G.parseCota(c.texto); if (!cm) return;
      const a = px(c.x1, c.y1), b = px(c.x2, c.y2), L = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (L > 10) fs.push(cm / L);
    });
    let f, calibrada = false;
    const ox = opt.ox || 0, oy = opt.oy || 0;
    if (opt.f) { f = opt.f; calibrada = true; }
    else if (fs.length) { fs.sort((a, b) => a - b); f = fs[Math.floor(fs.length / 2)]; calibrada = true; }
    else {
      let mx = 1e-9; (raw.paredes || []).forEach(p => { const a = px(p.x1, p.y1), b = px(p.x2, p.y2); mx = Math.max(mx, Math.abs(a[0]) , Math.abs(b[0]), Math.abs(a[1]), Math.abs(b[1])); });
      let minx = 1e18, maxx = -1e18, miny = 1e18, maxy = -1e18;
      (raw.paredes || []).forEach(p => [[p.x1, p.y1], [p.x2, p.y2]].forEach(q => { const a = px(q[0], q[1]); minx = Math.min(minx, a[0]); maxx = Math.max(maxx, a[0]); miny = Math.min(miny, a[1]); maxy = Math.max(maxy, a[1]); }));
      f = (opt.larguraPadraoM * 100) / (Math.max(maxx - minx, maxy - miny) || 1);
    }
    const cm = (x, y) => { const a = px(x, y); return [a[0] * f + ox, a[1] * f + oy]; };
    // 2) paredes
    const brutas = (raw.paredes || []).map(p => { const a = cm(p.x1, p.y1), b = cm(p.x2, p.y2); return { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }; });
    const e = G.endireitar(brutas, {});
    const segs = G.arredondar(e.segs, opt.grade);
    const paredes = segs.map((s, i) => Object.assign({ id: 'w' + (i + 1), esp: opt.esp }, s));
    const rot = (x, y) => G.girar(x, y, e.rotacao, e.centro);
    // 3) aberturas
    const aberturas = [];
    (raw.aberturas || []).forEach((a, i) => {
      const c0 = cm(a.x, a.y), c = rot(c0[0], c0[1]);
      let best = null; paredes.forEach(w => { const r = projT(w, c[0], c[1]); if (!best || r.d < best.d) best = { d: r.d, t: r.tc, w }; });
      if (!best || best.d > 80) return;
      const larg = Math.max(50, Math.min(400, (a.larg || 90) * (W + H) / 2000 * f));
      const porta = a.tipo === 'porta';
      aberturas.push({ id: 'a' + (i + 1), tipo: porta ? 'porta' : 'janela', parede: best.w.id, t: best.t, larg: Math.round(larg / 5) * 5,
        alt: porta ? 210 : 120, peitoril: porta ? 0 : 100, lado: 1 });
    });
    // 4) pontos
    const NAPAREDE = { interruptor: 1, tomada: 1, tv: 1, ar_condicionado: 1, camera: 0, caixa_som: 0, sensor: 0, echo: 1, ponto_luz: 0, spot: 0, arandela: 1, ventilador: 0, outro: 0 };
    const ALT = { interruptor: 110, tomada: 30, ponto_luz: 270, spot: 270, arandela: 180, ventilador: 270, tv: 120, ar_condicionado: 220, camera: 250, caixa_som: 250, sensor: 250, echo: 100, outro: 100 };
    const pontos = [];
    (raw.pontos || []).forEach((p, i) => {
      const c0 = cm(p.x, p.y), c = rot(c0[0], c0[1]);
      const tipo = ALT[p.tipo] != null ? p.tipo : 'outro';
      let x = c[0], y = c[1], parede = null;
      if (NAPAREDE[tipo]) { const k = G.colar({ x, y }, paredes, opt.colarMax); if (k) { x = k.x; y = k.y; parede = k.parede; } }
      const o = { id: 'p' + (i + 1), tipo, x: Math.round(x), y: Math.round(y), altura: ALT[tipo], parede, obs: p.obs || '' };
      if (tipo === 'interruptor') { o.teclas = Math.max(1, Math.min(4, p.teclas || 1)); o.caixa = '4x2'; o.neutro = true; }
      pontos.push(o);
    });
    const rotulos = (raw.rotulos || []).map(r => { const c0 = cm(r.x, r.y), c = rot(c0[0], c0[1]); return { texto: r.texto, x: c[0], y: c[1] }; });
    return { escalaCmPorPx: f, calibrada, rotacao: e.rotacao, centro: e.centro,
      planta: { v: 1, calibrada, peDireito: 270, paredes, aberturas, pontos, comodos: [], rotulos }, rotulos };
  };

  G.arredondar = function (segs, g) {
    const r = v => Math.round(v / g) * g;
    return segs.map(s => ({ x1: r(s.x1), y1: r(s.y1), x2: r(s.x2), y2: r(s.y2) })).filter(s => len(s) > 0);
  };

  /* ---------- cômodos: faces do grafo de paredes ---------- */
  G.dividir = function (segs, eps) {
    eps = eps || 1;
    const n = segs.length, cuts = segs.map(() => [0, 1]);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if (i === j) continue;
      const A = segs[i], B = segs[j];
      [[A.x1, A.y1], [A.x2, A.y2]].forEach(p => {
        const r = projT(B, p[0], p[1]);
        if (r.d <= eps * 1.5 && r.t > 1e-6 && r.t < 1 - 1e-6) cuts[j].push(r.t);
      });
    }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      const A = segs[i], B = segs[j];
      const rx = A.x2 - A.x1, ry = A.y2 - A.y1, sx = B.x2 - B.x1, sy = B.y2 - B.y1, den = rx * sy - ry * sx;
      if (Math.abs(den) < 1e-9) continue;
      const qx = B.x1 - A.x1, qy = B.y1 - A.y1, t = (qx * sy - qy * sx) / den, u = (qx * ry - qy * rx) / den;
      if (t > 1e-6 && t < 1 - 1e-6 && u > 1e-6 && u < 1 - 1e-6) { cuts[i].push(t); cuts[j].push(u); }
    }
    const V = [], E = new Set();
    const vid = (x, y) => {
      for (let i = 0; i < V.length; i++) if (Math.hypot(V[i].x - x, V[i].y - y) <= eps * 1.5) return i;
      V.push({ x, y }); return V.length - 1;
    };
    const edges = [];
    segs.forEach((s, i) => {
      const t = cuts[i].sort((a, b) => a - b).filter((v, k, a) => !k || v - a[k - 1] > 1e-6);
      for (let k = 0; k < t.length - 1; k++) {
        const u = vid(s.x1 + (s.x2 - s.x1) * t[k], s.y1 + (s.y2 - s.y1) * t[k]);
        const v = vid(s.x1 + (s.x2 - s.x1) * t[k + 1], s.y1 + (s.y2 - s.y1) * t[k + 1]);
        if (u === v) continue;
        const key = Math.min(u, v) + '-' + Math.max(u, v);
        if (E.has(key)) continue; E.add(key); edges.push([u, v]);
      }
    });

function mesh3dReal(p) {

  if (t === 'spot') { add(Cy(4.2, 1, mat(0xe2e8f0)), 0, 0, 0); add(Cy(2.8, .5, emis(0xfef08a)), 0, -.6, 0); return G3; }
  if (t === 'plafon' || t === 'ponto_luz') { add(Cy(15, 5, mat(0xf1f5f9)), 0, 0, 0); add(Cy(11, .6, emis(0xfef9c3)), 0, -2.7, 0); return G3; }
  if (t === 'pendente') { add(Cy(.4, 30, mat(0x64748b)), 0, 15, 0); add(new THREE.Mesh(new THREE.SphereGeometry(9, 20, 14), emis(0xfde68a)), 0, 0, 0); return G3; }
  if (t === 'trilho') { add(B(100, 2.4, 3, mat(0xe2e8f0)), 0, 0, 0); [-30, 0, 30].forEach(x => add(Cy(3, 5, mat(0x334155)), x, -3, 0)); return G3; }
  if (t === 'fita_led') { add(B(40, .8, 1.4, emis(0xfde047)), 0, 0, 0); return G3; }
  if (t === 'echo' || t === 'echo_dot' || t === 'echo_studio') { add(new THREE.Mesh(new THREE.SphereGeometry(5.2, 24, 18), mat(0x1f2937)), 0, 0, 0); const r = new THREE.Mesh(new THREE.TorusGeometry(4.6, .35, 8, 28), emis(0x38bdf8)); add(r, 0, 2.4, 0, Math.PI / 2); return G3; }
  if (t === 'echo_pop') { add(new THREE.Mesh(new THREE.SphereGeometry(5.4, 24, 18), mat(0x8b5cf6)), 0, 0, 0); return G3; }
  if (t === 'echo_show' || t === 'echo_hub') { add(B(20, 13, 3.2, mat(0x1f2937)), 0, 0, 0); add(B(18, 11, .3, emis(0x38bdf8)), 0, 0, 1.7); return G3; }
  if (t === 'caixa_som') { add(B(20, 20, 6, mat(0xf1f5f9)), 0, 0, 0); add(Cy(7, 1, mat(0x1f2937)), 0, 0, 3.4, Math.PI / 2); return G3; }
  if (t === 'tv') { add(B(100, 58, 3, mat(0x0b1020)), 0, 0, 0); add(B(94, 52, .3, emis(0x1e3a8a)), 0, 0, 1.7); return G3; }
  if (t === 'ar_condicionado') { add(B(90, 28, 20, mat(0xf8fafc)), 0, 0, 0); add(B(80, 2, 1, mat(0xcbd5e1)), 0, -6, 10.4); return G3; }
  if (t === 'ventilador') { add(Cy(5, 8, mat(0x475569)), 0, 0, 0); [0, 120, 240].forEach(a => { const b = B(45, .8, 9, mat(0xcbd5e1)); b.position.set(Math.cos(a * Math.PI / 180) * 26, -4, Math.sin(a * Math.PI / 180) * 26); b.rotation.y = -a * Math.PI / 180; G3.add(b); }); return G3; }
  if (t === 'camera') { add(new THREE.Mesh(new THREE.SphereGeometry(5.5, 18, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(0x0f172a)), 0, 0, 0, Math.PI); add(Cy(6, 1, mat(0xe2e8f0)), 0, 0, 0); return G3; }

$('#appsBox').addEventListener('click', async e => {
  const pp = e.target.closest('[data-p]'); if (pp) { S.sel = { k: 'ponto', id: pp.dataset.p }; mostrar('v2d'); refresh(); return; }

/* ===================== v2: cômodo ativo, finalizar ✓, novo cômodo por medidas, mover ===================== */
function fitBox(x0, y0, x1, y1) {
  const r = rectOf(), pad = 90, w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad, k = Math.max(w / r.width, h / r.height);
  S.view.w = k * r.width; S.view.x = (x0 + x1) / 2 - S.view.w / 2; S.view.y = (y0 + y1) / 2 - (k * r.height) / 2; renderSVG();
}
function fitComodo(c) { const xs = c.pontos.map(p => p[0]), ys = c.pontos.map(p => p[1]); fitBox(Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)); }
function ativarComodo(id, fitar) {
  S.ativo = id || null; const c = id ? getById(P.comodos, id) : null; S.sel = c ? { k: 'comodo', id } : null; refresh(); if (c && fitar) fitComodo(c);
}
async function finalizarComodo(id) {
  const c = getById(P.comodos, id); if (!c) return; const pend = M.pendenciasComodo(P, id);
  if (pend.length) {
    const r = await modal('Finalizar "' + c.nome + '"', [{ tipo: 'info', val: '<b>' + pend.length + ' pendência(s) neste cômodo:</b><br>' + pend.slice(0, 8).map(x => '• ' + esc(x.msg)).join('<br>') + (pend.length > 8 ? '<br>…' : '') }], 'Finalizar mesmo assim');
    if (!r) return;
  }
  snap(); c.feito = true; const prox = P.comodos.find(x => !x.feito && x.id !== id);
  if (prox) { S.ativo = prox.id; S.sel = { k: 'comodo', id: prox.id }; refresh(); fitComodo(prox); toast('"' + c.nome + '" finalizado ✓ — agora: ' + prox.nome); }
  else { S.ativo = null; S.sel = null; refresh(); toast('Todos os cômodos finalizados ✓', 4000); }
}
function reabrirComodo(id) { const c = getById(P.comodos, id); if (!c) return; snap(); c.feito = false; S.ativo = id; S.sel = { k: 'comodo', id }; refresh(); }
function renderRoombar() {
  const el = $('#roombar'), pr = M.progresso(P), bd = $('#badgeCom'); if (!el) return;
  if (bd) { bd.textContent = pr.feitos + '/' + pr.total; bd.className = 'badge' + (pr.total && pr.feitos === pr.total ? ' ok' : ''); bd.style.background = (pr.total && pr.feitos === pr.total) ? '' : '#475569'; }
  if (!P.comodos.length) { el.style.display = 'none'; return; } el.style.display = 'flex';
  let h = '<span class="rbt">Cômodos ' + pr.feitos + '/' + pr.total + '</span><button data-rb="todos"' + (!S.ativo ? ' class="on"' : '') + '>Todos</button>';
  P.comodos.forEach(c => { h += '<button data-rb="' + c.id + '" class="rb' + (c.feito ? ' feito' : '') + (S.ativo === c.id ? ' on' : '') + '">' + (c.feito ? '✓ ' : '') + esc(c.nome) + '</button>'; });
  if (S.ativo) { const c = getById(P.comodos, S.ativo); if (c) h += c.feito ? '<button data-rb="reabrir">Reabrir</button>' : '<button class="pri" data-rb="fin">Finalizar ✓</button>'; }
  el.innerHTML = h;
}
$('#roombar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.rb;
  if (k === 'todos') return ativarComodo(null); if (k === 'fin') return finalizarComodo(S.ativo); if (k === 'reabrir') return reabrirComodo(S.ativo);
  S.tool = 'sel'; S.ghost = null; ativarComodo(k, true);
});
const bordaDe = (poly, m) => { for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; if (G.projT({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, m[0], m[1]).d <= 2) return true; } return false; };
function paredesDoComodo(c) {
  const outros = P.comodos.filter(x => x.id !== c.id), ids = new Set();
  P.paredes.forEach(w => { const m = [(w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2]; if (bordaDe(c.pontos, m)) { if (!outros.some(o => bordaDe(o.pontos, m))) ids.add(w.id); } else if (G.dentro(c.pontos, m[0], m[1])) ids.add(w.id); });
  return ids;
}
function prepararMoverComodo(g) {
  M.normalizarParedes(P); const c = getById(P.comodos, g.cid), ids = paredesDoComodo(c); g.poly = c.pontos; g.fake = { paredes: P.paredes.filter(w => !ids.has(w.id)) };
}
const deslocarPoly = (poly, dx, dy) => poly.map(q => [q[0] + dx, q[1] + dy]);
function dentroOuPerto(poly, x, y, tol) { return G.dentro(poly, x, y) || bordaDe0(poly, x, y, tol); }
function bordaDe0(poly, x, y, tol) { for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; if (G.projT({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, x, y).d <= tol) return true; } return false; }

/* novo cômodo: o "fantasma" acompanha o cursor, gruda nas paredes dos vizinhos e só entra se não sobrepor */
const espGhost = () => P.paredes.length ? M.espPadrao(P) : S.esp;
function ghostMover(w) {
  const g = S.ghost; if (!g) return; const esp = espGhost(), p0 = M.retangulo(g.l, g.c, esp, 0, 0), W = p0[2][0], H = p0[2][1];
  const e = M.encaixar(P, p0, w.x - W / 2, w.y - H / 2, Math.max(25, wpp() * 22));
  g.dx = e.dx; g.dy = e.dy; g.enc = e.x || e.y; const inv = M.sobrepoe(P, deslocarPoly(p0, g.dx, g.dy)); g.valid = !inv; g.motivo = inv ? 'sobrepõe "' + inv.nome + '"' : ''; renderHint();
}
function iniciarNovoComodo() {
  return modal('Novo cômodo', [
    { k: 'nome', rot: 'Nome do cômodo', tipo: 'text', val: '', ph: 'ex.: Quarto casal' },
    { k: 'l', rot: 'Largura — vão livre (aceita 3,50 · 350)', tipo: 'text', val: '', ph: '3,50' },
    { k: 'c', rot: 'Comprimento — vão livre', tipo: 'text', val: '', ph: '4,00' },
    { k: 'pe', rot: 'Pé-direito deste cômodo em cm (vazio = padrão da planta: ' + P.peDireito + ')', tipo: 'text', val: '', ph: String(P.peDireito) },
    { k: 'porta', rot: 'Porta automática onde encostar em outro cômodo', tipo: 'select', val: '1', opts: [['1', 'Sim (80 cm)'], ['0', 'Não']] }], 'Posicionar',
    'Use as medidas do app Medidas (por dentro, parede a parede). Depois é só levar o cômodo até onde ele fica: ele gruda nas paredes dos vizinhos.').then(r => {
    if (!r) return; const l = G.parseCota(r.l), c = G.parseCota(r.c); if (!l || !c || l < 50 || c < 50) return toast('Medidas inválidas (mínimo 0,50 m).');
    S.tool = 'sel'; S.sel = null; S.p1 = null; S.live = null;
    S.ghost = { nome: (r.nome || '').trim() || ('Cômodo ' + (P.comodos.length + 1)), l, c, pe: Math.round(G.parseCota(r.pe || '') || 0) || 0, porta: r.porta === '1', dx: 0, dy: 0, enc: false, valid: true, motivo: '' };
    if (!P.paredes.length) { ghostMover({ x: 0, y: 0 }); S.ghost.dx = 0; S.ghost.dy = 0; return colocarGhost(true); }
    const rc = rectOf(), w0 = toWorldXY(rc.left + rc.width / 2, rc.top + rc.height / 2); ghostMover(w0); refresh({ panel: false });
    toast('Leve o cômodo até o lugar (mouse, ou arraste na tela) e clique/confirme. R gira · Esc cancela.', 7000);
  });
}
function colocarGhost(primeiro) {
  const g = S.ghost; if (!g) return; if (!g.valid) return toast('Não dá para colocar aqui: ' + g.motivo + '.');
  snap(); const r = M.novoComodo(P, { nome: g.nome, largura: g.l, comprimento: g.c, dx: g.dx, dy: g.dy, porta: g.porta, esp: P.paredes.length ? undefined : S.esp });
  if (!r.ok) { undo.pop(); return toast(r.motivo); }
  S.ghost = null; { const cn = getById(P.comodos, r.comodoId); if (cn && g.pe) cn.pe = g.pe; } S.ativo = r.comodoId; S.sel = r.comodoId ? { k: 'comodo', id: r.comodoId } : null; P.calibrada = true; refresh(); if (primeiro) fit();
  toast('"' + g.nome + '" colocado' + (r.portas ? ' com ' + r.portas + ' porta(s) automática(s)' : '') + '.');
}
function girarGhost() { const g = S.ghost; if (!g) return; const t = g.l; g.l = g.c; g.c = t; ghostMover(S.mouse || { x: g.dx, y: g.dy }); renderSVG(); }
function cancelarGhost() { S.ghost = null; refresh({ panel: false }); }
function roomAction(a) {
  if (a === 'novo') return iniciarNovoComodo();
  if (a === 'fin') return finalizarComodo(S.ativo);
  if (a === 'mover') {
    const id = (S.sel && S.sel.k === 'comodo') ? S.sel.id : S.ativo; if (!id) return toast('Selecione um cômodo (toque nele) ou escolha na barra de baixo.');
    S.tool = 'sel'; S.sel = { k: 'comodo', id }; refresh(); toast('Arraste o cômodo para onde ele vai. Ele gruda nos vizinhos e leva os pontos junto.', 6000);
  }
}
$('#hint').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.h) return; const h = b.dataset.h;
  if (h === 'gok') colocarGhost(); else if (h === 'grot') girarGhost(); else if (h === 'gno') cancelarGhost(); else if (h === 'cadeia') { S.cadeia = !S.cadeia; renderHint(); }
});

/* ===================== início ===================== */
function iniciar() {
  if (CTX.clienteId) { $('#fCliente').value = CTX.clienteId; $('#fCliente').readOnly = true; } if (CTX.imovel) $('#fImovel').value = CTX.imovel;
  $('#fNome').value = P.nome; if (S.estilo === 'real') { $('#bEstilo').textContent = 'Ícones: aparelho real'; $('#bEstilo').classList.add('on'); } renderTools(); renderPanel(); renderHint();
  const iniciaVazio = () => { if (CTX.nova) { try { localStorage.removeItem('planta_rascunho'); history.replaceState(null, '', location.pathname + location.search.replace(/[?&]nova=1/, '').replace(/^&/, '?')); } catch (e) { } return; } try { const r = JSON.parse(localStorage.getItem('planta_rascunho') || 'null'); if (r && r.P && r.P.paredes && r.P.paredes.length && (!CTX.plantaId) && (r.ctx || '') === (CTX.clienteId || '')) { P = M.migrar(r.P); S.planoId = r.planoId || null; $('#fNome').value = P.nome; } } catch (e) { } };
  if (CTX.plantaId) { gas('Planta_abrir', CTX.plantaId).then(pl => { const f = pl.fotoDataUrl || null; delete pl.fotoDataUrl; carregar(M.migrar(pl), CTX.plantaId, f); }).catch(e => { toast('Erro ao abrir: ' + e.message, 5000); }); }
  else if (!window.PLANTA_VIEW) iniciaVazio();
  refresh(); setTimeout(fit, 60);
  window.Planta = { t3: () => T3, get: () => JSON.parse(JSON.stringify(P)), carregar: (p, id) => carregar(M.migrar(p), id || null, null), salvar, levantamento: () => M.levantamento(P), validar: () => M.validar(P), apps: () => M.resumoApps(P) };
}
iniciar();
})();
