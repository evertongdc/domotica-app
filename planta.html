<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Planta · Domótica</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
:root{--or:#ff7a00;--bl:#1e88ff;--bg1:#0b1220;--bg2:#13213f;--gl:rgba(255,255,255,.07);--gl2:rgba(255,255,255,.12);--tx:#e8eefb;--mu:#9fb0cf;--er:#e5484d;--wa:#f2b705;--ok:#2ea44f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--tx);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--gl2);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 11px;cursor:pointer;backdrop-filter:blur(8px)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--or),#ff9a3d);border-color:transparent;color:#1a1000;font-weight:700}
button.on{outline:2px solid var(--bl);background:rgba(30,136,255,.25)}
button.danger{border-color:rgba(229,72,77,.6);color:#ffb4b6}
input,select,textarea{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:54px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
header#top{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--gl);border-bottom:1px solid var(--gl2);backdrop-filter:blur(14px);flex-wrap:wrap}
header#top input{width:auto;flex:1 1 130px;max-width:230px}
.brand{font-weight:800;letter-spacing:.3px}.brand span{color:var(--or)}
.sp{flex:1}
nav#tabs{display:flex;gap:6px;padding:6px 10px;overflow-x:auto}
nav#tabs button.on{background:linear-gradient(135deg,var(--or),#ff9a3d);color:#1a1000;font-weight:700;outline:none}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--er);color:#fff;font-size:11px;text-align:center}
.badge.ok{background:var(--ok)}
main{flex:1;min-height:0;position:relative}
section.view{position:absolute;inset:0;display:none}
section.view.on{display:flex}
#v2d{gap:8px;padding:0 8px 8px}
#tools,#panel{width:230px;flex:none;background:var(--gl);border:1px solid var(--gl2);border-radius:14px;padding:8px;overflow:auto;backdrop-filter:blur(14px)}
#panel{width:290px}
#cwrap{flex:1;min-width:0;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--gl2);background:#f4f6fa}
#svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#hint{position:absolute;left:10px;top:10px;right:10px;pointer-events:none;display:flex;gap:6px;flex-wrap:wrap}
#hint span{background:rgba(11,18,32,.82);color:#fff;border-radius:9px;padding:5px 9px;font-size:12px}
#hint .chips{pointer-events:auto;display:flex;gap:4px}
#hint .chips button{padding:3px 9px;border-radius:8px}
#zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#zoombtns button{width:38px;height:38px;padding:0;font-size:18px;background:rgba(11,18,32,.85);color:#fff}
.sec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);margin:12px 2px 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tool{text-align:left;padding:7px 8px;font-size:13px}
.pal{display:flex;align-items:center;gap:6px;text-align:left;padding:5px 6px;font-size:12px}
.pal i{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:6px;font-style:normal;font-weight:700;font-size:11px;color:#111;background:#fff;border:2px solid}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:9px;font-size:11px;background:var(--gl2)}
.note{font-size:12px;color:var(--mu)}
.card{background:var(--gl);border:1px solid var(--gl2);border-radius:12px;padding:10px;margin-bottom:10px}
.scroll{overflow:auto;padding:10px;width:100%}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--gl2);text-align:left;vertical-align:top}
th{color:var(--mu);font-weight:600;position:sticky;top:0;background:#101a33}
tr.click{cursor:pointer}tr.click:hover{background:var(--gl)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lv{display:inline-block;padding:1px 7px;border-radius:7px;font-size:11px;font-weight:700;margin-right:6px}
.lv.erro{background:var(--er)}.lv.aviso{background:var(--wa);color:#1a1000}.lv.info{background:#475569}
#v3d{flex-direction:column}
#bar3d{display:flex;gap:6px;padding:0 8px 6px;flex-wrap:wrap;align-items:center}
#bar3d select,#bar3d input{width:auto}
#c3d{flex:1;min-height:0;position:relative;margin:0 8px 8px;border-radius:14px;overflow:hidden;border:1px solid var(--gl2);background:#e9eef5}
#c3d canvas{display:block;width:100%;height:100%}
#leg3d{position:absolute;left:10px;bottom:10px;background:rgba(11,18,32,.8);border-radius:10px;padding:6px 9px;font-size:12px;color:#fff}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0b1220;color:#fff;border:1px solid var(--gl2);padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(3,8,18,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal.on{display:flex}
#mbox{width:min(440px,100%);max-height:90vh;overflow:auto;background:linear-gradient(160deg,#16264a,#0f1a33);border:1px solid var(--gl2);border-radius:16px;padding:14px}
#mbox h3{margin:0 0 6px}
@media (max-width:900px){
  #v2d{flex-direction:column;overflow:auto}
  #tools,#panel{width:auto;max-height:34vh;flex:none}
  #cwrap{flex:none;height:62vh}
  header#top input{max-width:none}
}
#roombar{position:absolute;left:10px;right:60px;bottom:10px;display:flex;gap:5px;overflow-x:auto;align-items:center;padding:5px 7px;background:rgba(11,18,32,.88);border-radius:12px;backdrop-filter:blur(8px)}
#roombar button{padding:4px 10px;border-radius:8px;white-space:nowrap;font-size:12.5px;color:#fff}
#roombar button.rb.feito{background:rgba(46,164,79,.3);border-color:#2ea44f}

#roombar .rbt{font-size:12px;color:#cbd5e1;white-space:nowrap;margin-right:2px}
#fPal{margin-bottom:6px}
#palVazio{font-size:12px;color:var(--mu);margin:6px 2px}

<script>// Chaves PÚBLICAS do projeto Supabase "domotica-erp" (a chave publishable foi feita para ficar no navegador;
// quem protege os dados é o RLS no banco). Nunca coloque aqui a chave service_role.
window.DOMOTICA_CFG = {

<script>// Faz o editor de planta (Planta_v2.html, feito para o Apps Script) salvar e abrir no Supabase.
// Implementa o mesmo "contrato" do servidor: Planta_salvar, Planta_abrir, Planta_listar, Planta_salvarImagem3D, Planta_lerFoto.
(function() {
  var CFG = window.DOMOTICA_CFG;
  var sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
  var UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  var CTXP = null;
  function must(r) { if (r.error) throw new Error(r.error.message); return r.data; }
  async function ctx() {
    if (CTXP) return CTXP;
    var s = (await sb.auth.getSession()).data.session;
    if (!s) { location.href = 'index.html'; throw new Error('Entre no sistema primeiro.'); }
    var m = must(await sb.from('memberships').select('org_id').eq('user_id', s.user.id).limit(1));
    if (!m.length) throw new Error('Sua conta ainda não está vinculada a uma empresa.');
    CTXP = { orgId: m[0].org_id, user: s.user };
    return CTXP;
  }
  function paraBlob(d) {
    var p = String(d).split(','), mime = (/data:([^;]+)/.exec(p[0]) || [])[1] || 'image/jpeg', b = atob(p[1]), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return new Blob([u], { type: mime });
  }
  function paraDataUrl(blob) { return new Promise(function(res, rej) { var r = new FileReader(); r.onload = function() { res(r.result); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  var EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp' };

  var API = {
    Planta_salvar: async function(obj) {
      var c = await ctx();
      var linha = { nome: String(obj.nome || 'Planta').slice(0, 120), imovel: obj.imovel ? String(obj.imovel).slice(0, 160) : null, client_id: UUID.test(obj.clienteId || '') ? obj.clienteId : null, dados: obj.planta };
      var id = UUID.test(obj.id || '') ? obj.id : null;
      if (id) must(await sb.from('plans').update(linha).eq('id', id));
      else id = must(await sb.from('plans').insert(Object.assign({ org_id: c.orgId }, linha)).select('id').single()).id;
      if (obj.fotoDataUrl) {
        var blob = paraBlob(obj.fotoDataUrl), ext = EXT[blob.type];
        if (!ext) throw new Error('Formato de imagem não suportado (use JPG, PNG ou WEBP).');
        var caminho = c.orgId + '/' + id + '/foto.' + ext;
        var antigo = must(await sb.from('plans').select('imagem_path').eq('id', id).single()).imagem_path;
        var up = await sb.storage.from('plantas').upload(caminho, blob, { contentType: blob.type, upsert: true });
        if (up.error) throw new Error('Não consegui guardar a imagem da planta: ' + up.error.message);
        if (antigo && antigo !== caminho) await sb.storage.from('plantas').remove([antigo]);
        must(await sb.from('plans').update({ imagem_path: caminho }).eq('id', id));
      } else if (obj.fotoDataUrl === '') {
        var a = must(await sb.from('plans').select('imagem_path').eq('id', id).single()).imagem_path;
        if (a) await sb.storage.from('plantas').remove([a]);
        must(await sb.from('plans').update({ imagem_path: null }).eq('id', id));
      }
      return { id: id };
    },
    Planta_abrir: async function(id) {
      await ctx();
      var row = must(await sb.from('plans').select('dados, imagem_path, nome').eq('id', id).single());
      var p = row.dados || { v: 2, nome: row.nome };
      if (row.imagem_path) {
        var d = await sb.storage.from('plantas').download(row.imagem_path);
        if (d.error) throw new Error('Não consegui abrir a imagem da planta: ' + d.error.message);
        p.fotoDataUrl = await paraDataUrl(d.data);
      }
      return p;
    },
    Planta_listar: async function(clienteId) {
      var c = await ctx();
      var q = sb.from('plans').select('id, nome, imovel, dados, created_at').eq('org_id', c.orgId).not('dados', 'is', null).order('updated_at', { ascending: false });
      if (UUID.test(clienteId || '')) q = q.eq('client_id', clienteId);
      return must(await q).map(function(r) { var d = r.dados || {}; return { id: r.id, nome: r.nome, imovel: r.imovel || '', comodos: (d.comodos || []).length, pontos: (d.pontos || []).length }; });
    },
    Planta_salvarImagem3D: async function(plantaId, comodoId, dataUrl) {
      var c = await ctx(), blob = paraBlob(dataUrl);
      var caminho = c.orgId + '/' + plantaId + '/3d_' + String(comodoId).replace(/[^\w-]/g, '') + '.jpg';
      var up = await sb.storage.from('plantas').upload(caminho, blob, { contentType: 'image/jpeg', upsert: true });
      if (up.error) throw new Error('Não consegui guardar a imagem 3D: ' + up.error.message);
      return { fileId: caminho };
    },
    Planta_lerFoto: async function() { throw new Error('A leitura por IA ainda não está ligada neste servidor. Marque a planta manualmente por cima da imagem.'); },
  };

  function mk(okF, failF) {
    return new Proxy({}, { get: function(_, fn) {
      if (fn === 'withSuccessHandler') return function(f) { return mk(f, failF); };
      if (fn === 'withFailureHandler') return function(g) { return mk(okF, g); };
      return function() { var a = [].slice.call(arguments); Promise.resolve().then(function() { if (!API[fn]) throw new Error('Função não existe: ' + fn); return API[fn].apply(null, a); }).then(okF).catch(function(e) { if (failF) failF(e); }); };
    } });
  }
  window.google = { script: { run: mk(function() {}, function() {}) } };
  window.addEventListener('load', function() { ctx().catch(function() {}); });
})();
</script>

<script>
/* Planta_geo.js — núcleo de geometria (roda no navegador e no Node).
 * Coordenadas em unidades livres; depois da calibração, 1 unidade = 1 cm. */
(function (root) {
  'use strict';
  const G = {};
  const D2R = Math.PI / 180;
  const len = s => Math.hypot(s.x2 - s.x1, s.y2 - s.y1);

  /* ---------- projeção ponto → segmento ---------- */
  function projT(s, px, py) {
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1, L2 = dx * dx + dy * dy || 1e-9;
    const raw = ((px - s.x1) * dx + (py - s.y1) * dy) / L2;
    const tc = Math.max(0, Math.min(1, raw));
    const x = s.x1 + dx * tc, y = s.y1 + dy * tc;
    return { t: raw, tc, x, y, d: Math.hypot(px - x, py - y) };
  }
  G.projT = projT;

  /* ---------- Ramer–Douglas–Peucker (rabisco → poucos pontos) ---------- */
  G.simplificar = function (pts, eps) {
    if (pts.length < 3) return pts.slice();
    const a = pts[0], b = pts[pts.length - 1];
    let mx = -1, mi = -1;
    for (let i = 1; i < pts.length - 1; i++) {
      const d = projT({ x1: a.x, y1: a.y, x2: b.x, y2: b.y }, pts[i].x, pts[i].y).d;
      if (d > mx) { mx = d; mi = i; }
    }
    if (mx <= eps) return [a, b];
    const l = G.simplificar(pts.slice(0, mi + 1), eps);
    const r = G.simplificar(pts.slice(mi), eps);
    return l.slice(0, -1).concat(r);
  };

  G.tracoParaSegs = function (pts, eps) {
    const p = G.simplificar(pts, eps), out = [];
    for (let i = 0; i < p.length - 1; i++) out.push({ x1: p[i].x, y1: p[i].y, x2: p[i + 1].x, y2: p[i + 1].y });
    return out;
  };

  /* ---------- ângulo dominante (corrige foto/esboço torto) ---------- */
  G.anguloDominante = function (S) {
    let c = 0, s = 0;
    S.forEach(g => { const L = len(g), a = Math.atan2(g.y2 - g.y1, g.x2 - g.x1); c += L * Math.cos(4 * a); s += L * Math.sin(4 * a); });
    return Math.atan2(s, c) / 4 / D2R;
  };

  function agrupar(arr, key, tol) {
    const a = arr.slice().sort((p, q) => key(p) - key(q)), out = []; let cur = [];
    a.forEach(it => {
      if (cur.length && key(it) - key(cur[cur.length - 1]) > tol) { out.push(cur); cur = []; }
      cur.push(it);
    });
    if (cur.length) out.push(cur);
    return out;
  }

  /* ---------- ENDIREITAR: traços tortos → paredes retas e conectadas ---------- */
  G.endireitar = function (segs, opt) {
    opt = Object.assign({ tolAngulo: 20, tolCluster: null, gap: null, minLen: null, corrigirRotacao: true }, opt || {});
    let S = segs.map(s => ({ x1: +s.x1, y1: +s.y1, x2: +s.x2, y2: +s.y2 })).filter(s => len(s) > 0);
    if (!S.length) return { segs: [], rotacao: 0 };
    let rot = 0, centro = { x: 0, y: 0 };
    if (opt.corrigirRotacao) {
      rot = G.anguloDominante(S);
      if (Math.abs(rot) > 0.4) {
        let cx = 0, cy = 0; S.forEach(s => { cx += s.x1 + s.x2; cy += s.y1 + s.y2; }); cx /= 2 * S.length; cy /= 2 * S.length;
        centro = { x: cx, y: cy };
        const c = Math.cos(-rot * D2R), sn = Math.sin(-rot * D2R);
        const R = (x, y) => [cx + (x - cx) * c - (y - cy) * sn, cy + (x - cx) * sn + (y - cy) * c];
        S = S.map(s => { const a = R(s.x1, s.y1), b = R(s.x2, s.y2); return { x1: a[0], y1: a[1], x2: b[0], y2: b[1] }; });
      } else rot = 0;
    }
    let minx = 1e18, maxx = -1e18, miny = 1e18, maxy = -1e18;
    S.forEach(s => { minx = Math.min(minx, s.x1, s.x2); maxx = Math.max(maxx, s.x1, s.x2); miny = Math.min(miny, s.y1, s.y2); maxy = Math.max(maxy, s.y1, s.y2); });
    const D = Math.max(maxx - minx, maxy - miny) || 1;
    const tol = opt.tolCluster != null ? opt.tolCluster : D * 0.025;
    const gap = opt.gap != null ? opt.gap : D * 0.04;
    const minLen = opt.minLen != null ? opt.minLen : D * 0.03;

    // 1) classificar H / V / diagonal
    let H = [], V = [], Dg = [];
    S.forEach(s => {
      const dx = Math.abs(s.x2 - s.x1), dy = Math.abs(s.y2 - s.y1), ang = Math.atan2(dy, dx) / D2R, L = len(s);

    h += '<div class="sec">Aparelhos neste ' + (a.tipo === 'protocolo' ? 'protocolo' : 'app') + ' (' + ap.length + ')</div>' + (ap.length ? ap.map(x => '<button class="pill" data-p="' + x.id + '" style="margin:2px 4px 2px 0">' + esc(M.nomeDe(x) + ' · ' + ((getById(P.comodos, x.comodo) || { nome: 'sem cômodo' }).nome)) + '</button>').join('') : '<div class="note">Nenhum aparelho vinculado ainda (escolha o app no painel do aparelho).</div>');
    h += '<div class="row" style="margin-top:8px"><button data-a="copy">Copiar ficha</button><button class="danger" data-a="delapp">Excluir</button></div></div>';
  });
  $('#appsBox').innerHTML = h; updBadgeApps();
}
$('#appsBox').addEventListener('change', e => {
  const t = e.target; if (t.dataset.g) { snap(); P[t.dataset.g] = t.value; rascunho(); return; }
  const card = t.closest('[data-id]'), a = card && getById(P.apps, card.dataset.id); if (!a || !t.dataset.f) return;
  snap(); a[t.dataset.f] = t.dataset.f === 'encaminha' ? !!t.value : t.value; rascunho(); updBadgeApps(); updateBadge();
  if (t.dataset.f === 'tipo' || t.dataset.f === 'status') renderApps();
});
$('#appsBox').addEventListener('click', async e => {
  const pp = e.target.closest('[data-p]'); if (pp) { S.sel = { k: 'ponto', id: pp.dataset.p }; mostrar('v2d'); refresh(); return; }
  const b = e.target.closest('button'); if (!b || !b.dataset.a) return; const card = b.closest('[data-id]'), a = card && getById(P.apps, card.dataset.id);
  if (b.dataset.a === 'addapp' || b.dataset.a === 'addprot') {
    const prot = b.dataset.a === 'addprot', nome = await escolherApp(prot ? 'Adicionar protocolo' : 'Adicionar app / plataforma', prot); if (!nome) return;
    if ((P.apps || []).some(x => x.nome.toLowerCase() === nome.toLowerCase())) return toast('Já está na lista.');
    snap(); M.novoApp(P, nome, { tipo: prot ? 'protocolo' : 'app' }); refresh({ panel: false }); renderApps();
  } else if (b.dataset.a === 'copyall') copiar((P.apps || []).map(fichaApp).join('\n\n———\n\n') || '(nenhum app)', 'Fichas copiadas.');
  else if (a && b.dataset.a === 'copy') copiar(fichaApp(a), 'Ficha copiada.');
  else if (a && b.dataset.a === 'delapp') {
    if (!(await confirmar('Excluir "' + a.nome + '"? Os aparelhos ficam sem app.', 'Excluir'))) return;
    snap(); P.apps = P.apps.filter(x => x.id !== a.id); P.pontos.forEach(p => { if (p.appId === a.id) p.appId = ''; }); refresh({ panel: false }); renderApps();
  }
});

/* ===================== v2: cômodo ativo, finalizar ✓, novo cômodo por medidas, mover ===================== */
function fitBox(x0, y0, x1, y1) {
  const r = rectOf(), pad = 90, w = x1 - x0 + 2 * pad, h = y1 - y0 + 2 * pad, k = Math.max(w / r.width, h / r.height);
  S.view.w = k * r.width; S.view.x = (x0 + x1) / 2 - S.view.w / 2; S.view.y = (y0 + y1) / 2 - (k * r.height) / 2; renderSVG();
}
function fitComodo(c) { const xs = c.pontos.map(p => p[0]), ys = c.pontos.map(p => p[1]); fitBox(Math.min.apply(null, xs), Math.min.apply(null, ys), Math.max.apply(null, xs), Math.max.apply(null, ys)); }
function ativarComodo(id, fitar) {
  S.ativo = id || null; const c = id ? getById(P.comodos, id) : null; S.sel = c ? { k: 'comodo', id } : null; refresh(); if (c && fitar) fitComodo(c);
}
async function finalizarComodo(id) {
  const c = getById(P.comodos, id); if (!c) return; const pend = M.pendenciasComodo(P, id);
  if (pend.length) {
    const r = await modal('Finalizar "' + c.nome + '"', [{ tipo: 'info', val: '<b>' + pend.length + ' pendência(s) neste cômodo:</b><br>' + pend.slice(0, 8).map(x => '• ' + esc(x.msg)).join('<br>') + (pend.length > 8 ? '<br>…' : '') }], 'Finalizar mesmo assim');
    if (!r) return;
  }
  snap(); c.feito = true; const prox = P.comodos.find(x => !x.feito && x.id !== id);
  if (prox) { S.ativo = prox.id; S.sel = { k: 'comodo', id: prox.id }; refresh(); fitComodo(prox); toast('"' + c.nome + '" finalizado ✓ — agora: ' + prox.nome); }
  else { S.ativo = null; S.sel = null; refresh(); toast('Todos os cômodos finalizados ✓', 4000); }
}
function reabrirComodo(id) { const c = getById(P.comodos, id); if (!c) return; snap(); c.feito = false; S.ativo = id; S.sel = { k: 'comodo', id }; refresh(); }
function renderRoombar() {
  const el = $('#roombar'), pr = M.progresso(P), bd = $('#badgeCom'); if (!el) return;
  if (bd) { bd.textContent = pr.feitos + '/' + pr.total; bd.className = 'badge' + (pr.total && pr.feitos === pr.total ? ' ok' : ''); bd.style.background = (pr.total && pr.feitos === pr.total) ? '' : '#475569'; }
  if (!P.comodos.length) { el.style.display = 'none'; return; } el.style.display = 'flex';
  let h = '<span class="rbt">Cômodos ' + pr.feitos + '/' + pr.total + '</span><button data-rb="todos"' + (!S.ativo ? ' class="on"' : '') + '>Todos</button>';
  P.comodos.forEach(c => { h += '<button data-rb="' + c.id + '" class="rb' + (c.feito ? ' feito' : '') + (S.ativo === c.id ? ' on' : '') + '">' + (c.feito ? '✓ ' : '') + esc(c.nome) + '</button>'; });
  if (S.ativo) { const c = getById(P.comodos, S.ativo); if (c) h += c.feito ? '<button data-rb="reabrir">Reabrir</button>' : '<button class="pri" data-rb="fin">Finalizar ✓</button>'; }
  el.innerHTML = h;
}
$('#roombar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const k = b.dataset.rb;
  if (k === 'todos') return ativarComodo(null); if (k === 'fin') return finalizarComodo(S.ativo); if (k === 'reabrir') return reabrirComodo(S.ativo);
  S.tool = 'sel'; S.ghost = null; ativarComodo(k, true);
});
const bordaDe = (poly, m) => { for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; if (G.projT({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, m[0], m[1]).d <= 2) return true; } return false; };
function paredesDoComodo(c) {
  const outros = P.comodos.filter(x => x.id !== c.id), ids = new Set();
  P.paredes.forEach(w => { const m = [(w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2]; if (bordaDe(c.pontos, m)) { if (!outros.some(o => bordaDe(o.pontos, m))) ids.add(w.id); } else if (G.dentro(c.pontos, m[0], m[1])) ids.add(w.id); });
  return ids;
}
function prepararMoverComodo(g) {
  M.normalizarParedes(P); const c = getById(P.comodos, g.cid), ids = paredesDoComodo(c); g.poly = c.pontos; g.fake = { paredes: P.paredes.filter(w => !ids.has(w.id)) };
}
const deslocarPoly = (poly, dx, dy) => poly.map(q => [q[0] + dx, q[1] + dy]);
function dentroOuPerto(poly, x, y, tol) { return G.dentro(poly, x, y) || bordaDe0(poly, x, y, tol); }
function bordaDe0(poly, x, y, tol) { for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; if (G.projT({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, x, y).d <= tol) return true; } return false; }

/* novo cômodo: o "fantasma" acompanha o cursor, gruda nas paredes dos vizinhos e só entra se não sobrepor */
const espGhost = () => P.paredes.length ? M.espPadrao(P) : S.esp;
function ghostMover(w) {
  const g = S.ghost; if (!g) return; const esp = espGhost(), p0 = M.retangulo(g.l, g.c, esp, 0, 0), W = p0[2][0], H = p0[2][1];
  const e = M.encaixar(P, p0, w.x - W / 2, w.y - H / 2, Math.max(25, wpp() * 22));
  g.dx = e.dx; g.dy = e.dy; g.enc = e.x || e.y; const inv = M.sobrepoe(P, deslocarPoly(p0, g.dx, g.dy)); g.valid = !inv; g.motivo = inv ? 'sobrepõe "' + inv.nome + '"' : ''; renderHint();
}
function iniciarNovoComodo() {
  return modal('Novo cômodo', [
    { k: 'nome', rot: 'Nome do cômodo', tipo: 'text', val: '', ph: 'ex.: Quarto casal' },
    { k: 'l', rot: 'Largura — vão livre (aceita 3,50 · 350)', tipo: 'text', val: '', ph: '3,50' },
    { k: 'c', rot: 'Comprimento — vão livre', tipo: 'text', val: '', ph: '4,00' },
    { k: 'porta', rot: 'Porta automática onde encostar em outro cômodo', tipo: 'select', val: '1', opts: [['1', 'Sim (80 cm)'], ['0', 'Não']] }], 'Posicionar',
    'Use as medidas do app Medidas (por dentro, parede a parede). Depois é só levar o cômodo até onde ele fica: ele gruda nas paredes dos vizinhos.').then(r => {
    if (!r) return; const l = G.parseCota(r.l), c = G.parseCota(r.c); if (!l || !c || l < 50 || c < 50) return toast('Medidas inválidas (mínimo 0,50 m).');
    S.tool = 'sel'; S.sel = null; S.p1 = null; S.live = null;
    S.ghost = { nome: (r.nome || '').trim() || ('Cômodo ' + (P.comodos.length + 1)), l, c, porta: r.porta === '1', dx: 0, dy: 0, enc: false, valid: true, motivo: '' };
    if (!P.paredes.length) { ghostMover({ x: 0, y: 0 }); S.ghost.dx = 0; S.ghost.dy = 0; return colocarGhost(true); }
    const rc = rectOf(), w0 = toWorldXY(rc.left + rc.width / 2, rc.top + rc.height / 2); ghostMover(w0); refresh({ panel: false });
    toast('Leve o cômodo até o lugar (mouse, ou arraste na tela) e clique/confirme. R gira · Esc cancela.', 7000);
  });
}
function colocarGhost(primeiro) {
  const g = S.ghost; if (!g) return; if (!g.valid) return toast('Não dá para colocar aqui: ' + g.motivo + '.');
  snap(); const r = M.novoComodo(P, { nome: g.nome, largura: g.l, comprimento: g.c, dx: g.dx, dy: g.dy, porta: g.porta, esp: P.paredes.length ? undefined : S.esp });
  if (!r.ok) { undo.pop(); return toast(r.motivo); }
  S.ghost = null; S.ativo = r.comodoId; S.sel = r.comodoId ? { k: 'comodo', id: r.comodoId } : null; P.calibrada = true; refresh(); if (primeiro) fit();
  toast('"' + g.nome + '" colocado' + (r.portas ? ' com ' + r.portas + ' porta(s) automática(s)' : '') + '.');
}
function girarGhost() { const g = S.ghost; if (!g) return; const t = g.l; g.l = g.c; g.c = t; ghostMover(S.mouse || { x: g.dx, y: g.dy }); renderSVG(); }
function cancelarGhost() { S.ghost = null; refresh({ panel: false }); }
function roomAction(a) {
  if (a === 'novo') return iniciarNovoComodo();
  if (a === 'fin') return finalizarComodo(S.ativo);
  if (a === 'mover') {
    const id = (S.sel && S.sel.k === 'comodo') ? S.sel.id : S.ativo; if (!id) return toast('Selecione um cômodo (toque nele) ou escolha na barra de baixo.');
    S.tool = 'sel'; S.sel = { k: 'comodo', id }; refresh(); toast('Arraste o cômodo para onde ele vai. Ele gruda nos vizinhos e leva os pontos junto.', 6000);
  }
}
$('#hint').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !b.dataset.h) return; const h = b.dataset.h;
  if (h === 'gok') colocarGhost(); else if (h === 'grot') girarGhost(); else if (h === 'gno') cancelarGhost(); else if (h === 'cadeia') { S.cadeia = !S.cadeia; renderHint(); }
});

/* ===================== início ===================== */
function iniciar() {
  if (CTX.clienteId) { $('#fCliente').value = CTX.clienteId; $('#fCliente').readOnly = true; } if (CTX.imovel) $('#fImovel').value = CTX.imovel;
  $('#fNome').value = P.nome; renderTools(); renderPanel(); renderHint();
  const iniciaVazio = () => { try { const r = JSON.parse(localStorage.getItem('planta_rascunho') || 'null'); if (r && r.P && r.P.paredes && r.P.paredes.length && (!CTX.plantaId) && (r.ctx || '') === (CTX.clienteId || '')) { P = M.migrar(r.P); S.planoId = r.planoId || null; $('#fNome').value = P.nome; } } catch (e) { } };
  if (CTX.plantaId) { gas('Planta_abrir', CTX.plantaId).then(pl => { const f = pl.fotoDataUrl || null; delete pl.fotoDataUrl; carregar(M.migrar(pl), CTX.plantaId, f); }).catch(e => { toast('Erro ao abrir: ' + e.message, 5000); }); }
  else iniciaVazio();
  refresh(); setTimeout(fit, 60);
  window.Planta = { get: () => JSON.parse(JSON.stringify(P)), carregar: (p, id) => carregar(M.migrar(p), id || null, null), salvar, levantamento: () => M.levantamento(P), validar: () => M.validar(P), apps: () => M.resumoApps(P) };
}
iniciar();
})();
